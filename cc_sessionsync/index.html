.pb{position:relative;display:inline-flex;align-items:center;gap:5px;background:transparent;color:var(--muted);padding:5px 9px;border-radius:8px;font-size:calc(13.5px*var(--fk))}
.pb .ic{width:15px;height:15px}
.pb:hover{background:var(--hover);color:var(--text)}
.pb.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}.pb.on .ic{color:var(--accent)}
.pb .cnt{font-size:calc(12px*var(--fk));background:var(--accent);color:#fff;border-radius:9px;padding:0 5px;line-height:calc(15px*var(--fk))}
.pb .rdot{top:3px;right:3px}
.tbx.on{background:var(--hover);color:var(--accent)}
#nav.compact .pb>span:not(.cnt):not(.rdot){display:none}#nav.compact .pb{padding:5px 7px}
#nav{min-width:0;overflow-x:auto;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}
.sh{padding:10px 10px 6px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--line2);flex:none}
.sht{display:flex;align-items:center;gap:7px;cursor:pointer;padding:2px 4px;border-radius:7px}
.sht .ic{width:16px;height:16px;color:var(--muted)}
.sht b{font-size:calc(14.5px*var(--fk))}.sht em{font-style:normal;font-size:calc(12px*var(--fk));color:var(--faint)}
.sht .sp{flex:1}
.side.on .sht .ic:first-child{color:var(--accent)}
button.sm{padding:2px 5px}button.sm .ic{width:14px;height:14px}
.side .gsearch{width:auto;padding-right:3px}
.sfl{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sfl .seg button{font-size:calc(12.5px*var(--fk));padding:1px 8px}
.sfl select{font-size:calc(12.5px*var(--fk));padding:2px 4px;flex:1 1 76px;min-width:76px}
.tn.leaf{padding-left:8px}
.tn.leaf .lb{font-weight:400}
.tn.leaf .n{font-size:calc(12px*var(--fk))}
.tn.more{color:var(--faint);font-size:calc(12.5px*var(--fk));padding-left:22px}
.pgv h2{margin-bottom:4px}
.pgv>.card{padding:14px 16px}
.pvhd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pvft{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px}
/* v0.2.3：关闭桌面端并执行 */
.cr{display:flex;flex-direction:column;gap:10px;font-size:calc(14px*var(--fk))}
.cr .crq{display:flex;align-items:center;gap:8px;margin:0;font-size:calc(15.5px*var(--fk))}.cr .crq .ic{color:var(--warn);width:18px;height:18px}
.cr .crk{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:calc(13.5px*var(--fk));background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cr .crk>span:nth-child(odd){color:var(--muted)}.cr .crk>span:nth-child(even){word-break:break-all}
.cr ul{margin:4px 0 0;padding-left:18px}.cr ul li{margin:2px 0;font-size:calc(13px*var(--fk))}.cr code{font-size:calc(12.5px*var(--fk));word-break:break-all}
.cr .crok{border:1px solid var(--ok);background:var(--ok-weak);border-radius:10px;padding:8px 10px;font-size:calc(13.5px*var(--fk))}
.cr .crok .ic{width:14px;height:14px;color:var(--ok);vertical-align:-2px}
.crs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.crs li{display:flex;align-items:center;gap:8px;color:var(--muted)}.crs li.cur{color:var(--text);font-weight:600}.crs li.cur .dim{font-weight:400}
.crs li.bad{color:var(--bad)}.crs li.bad .ic{width:16px;height:16px}.crs li.ok{color:var(--text)}.crs li.ok .ic{color:var(--ok);width:16px;height:16px}
.crs .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);margin:0 4px}
.crs .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:crspin .8s linear infinite;margin:0 1px}
@keyframes crspin{to{transform:rotate(360deg)}}
.crbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.crbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.crj{list-style:none;padding:0 !important}.crj li{display:flex;gap:6px;align-items:baseline}
td.nw,th.nw{white-space:nowrap}
#mdCr{margin-left:6px;padding:1px 8px;font-size:calc(13px*var(--fk))}
.ag+.ag{border-top:1px solid var(--line2)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.ag.busy{opacity:.6;pointer-events:none}
@keyframes agin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* 顶部导航：一条分段轨道（和页面里的分段按钮同一套样式） */
.pnav{background:var(--hover);border-radius:11px;padding:3px;gap:1px}
.pb{border-radius:8px;padding:4px 10px}.pb:hover{background:var(--hover2)}
.pb.on{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06)}
#banLegacy .lglist{margin:4px 0 4px 18px;padding:0;font-size:calc(13px*var(--fk))}#banLegacy .lglist li{margin:1px 0}
.banmore{display:flex;justify-content:center;margin:-6px auto 12px;max-width:1180px}
.banmore button{font-size:calc(12.5px*var(--fk));padding:2px 12px;border-radius:999px;color:var(--muted);background:var(--hover)}
</style>
</head>

<div class="app" id="app">
  <header class="top">
    <button class="tbx" id="tbSide" title="收起 / 展开会话列表（Ctrl+B）"><i data-ic="panelL"></i></button>
    <button class="brand" id="brand" title="回到会话"><img src="/icon.png" alt=""><span>CC Session Sync</span><span class="ver">v__VERSION__</span></button>
    <nav class="pnav" id="nav">
      <button class="pb" data-p="timeline" title="时间线与备份：选时间点预览 / 恢复；自动备份、回收站；撤销记录（同步、导入、转换、会话操作）"><i data-ic="history"></i><span>时间线与备份</span></button>
      <button class="pb" data-p="sync" title="账号同步"><i data-ic="users"></i><span>账号同步</span></button>
      <button class="pb" data-p="convert" title="会话转换：Claude Code / Codex / DeepSeek Harness / Cursor / OpenCode / ZCode 任意互转"><i data-ic="shuffle"></i><span>会话转换</span></button>
      <button class="pb" data-p="usage" title="用量统计"><i data-ic="chart"></i><span>用量</span></button>
      <button class="pb" data-p="diag" title="诊断与自检"><i data-ic="activity"></i><span>诊断自检</span><span class="cnt" id="diagCnt" hidden></span></button>
      <button class="pb" id="tbUpd" title="检查更新"><i data-ic="refresh"></i><span>检查更新</span><span class="rdot"></span></button>
    </nav>
    <span class="sp"></span>
    <div class="topact">
      <button class="tbx" id="tbTheme" title="主题"></button>
      <button class="tbx" id="tbSet" data-p="settings" title="设置"><i data-ic="gear"></i></button>
    </div>
  </header>
  <div class="body">
    <aside class="side" id="side">
      <div class="sh">
        <div class="sht" id="sdHead" title="回到会话"><i data-ic="list"></i><b>会话</b><em id="nvSess"></em><span class="sp"></span>
          <button class="ghost sm" id="sdImp" title="导入 .md / .html，变成新的 Claude Code 会话"><i data-ic="upload"></i></button>
          <button class="ghost sm" id="sdRef" title="刷新"><i data-ic="refresh"></i></button></div>
        <label class="gsearch" title="搜标题 / 第一句 / 目录 / id；Ctrl+Enter 在内容里搜"><i data-ic="search"></i><input type="search" id="gQ" placeholder="搜会话（Ctrl+K）"><button class="ghost sm" id="sdFt" title="在全部会话内容里搜（Ctrl+Enter）"><i data-ic="text"></i></button></label>
        <div class="sfl"><select id="sdAg" title="应用"><option value="">全部应用</option><option value="claude">Claude</option><option value="codex">Codex</option><option value="dsh">DeepSeek</option><option value="cursor">Cursor</option><option value="opencode">OpenCode</option><option value="zcode">ZCode</option></select>
          <select id="sdDate" title="时间"><option value="">不限时间</option><option value="1">今天</option><option value="7">7 天</option><option value="30">30 天</option></select>
          <select id="sdStat" title="归档"><option value="live">没归档</option><option value="archived">已归档</option><option value="all">全部</option></select></div>
      </div>
      <div class="trh"><span>分组</span><button class="eye" id="trEye" title="显示完整账号"></button><span class="sp"></span><span class="seg" id="trMode"><button data-m="acct">按账号</button><button data-m="proj">按项目</button></span></div>
      <div class="tree" id="tree"><div class="hint">读取中…</div></div>
    </aside>
    <div class="grip" id="sideGrip" title="拖动调整宽度"></div>
    <main class="main" id="main">
      <div id="bans"></div>
      <section class="page full" id="pg-sessions"></section>
      <section class="page full" id="pg-timeline"></section>
      <section class="page" id="pg-sync"></section>
      <section class="page" id="pg-codex"></section>
      <section class="page" id="pg-dsh"></section>
      <section class="page" id="pg-cursor"></section>
      <section class="page" id="pg-convert"></section>
      <section class="page full" id="pg-usage"></section>
      <section class="page" id="pg-settings"></section>
      <section class="page" id="pg-diag"></section>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="dlg" id="dlg"><div class="box">
  <div class="hd"><span id="dlgTitle"></span><button class="ghost" onclick="closeDlg()"><i data-ic="x"></i></button></div>
  <div class="bd" id="dlgBody"></div>
  <div class="ft" id="dlgFt"><button onclick="closeDlg()">关闭</button></div>
</div></div>

// 单调三次样条：平滑但不越过数据（不会画出负数）
function usMono(pts){
  const n = pts.length; if (!n) return ""; if (n === 1) return `M${pts[0][0]},${pts[0][1]}`;
  const dx = [], m = [], t = [];
  for (let i = 0; i < n-1; i++) { dx[i] = pts[i+1][0] - pts[i][0]; m[i] = (pts[i+1][1] - pts[i][1]) / (dx[i] || 1); }
  t[0] = m[0]; t[n-1] = m[n-2];
  for (let i = 1; i < n-1; i++) t[i] = m[i-1] * m[i] <= 0 ? 0 : (m[i-1] + m[i]) / 2;
  for (let i = 0; i < n-1; i++) { if (!m[i]) { t[i] = 0; t[i+1] = 0; continue; }
    const a = t[i]/m[i], b = t[i+1]/m[i], h = a*a + b*b; if (h > 9) { const k = 3/Math.sqrt(h); t[i] = k*a*m[i]; t[i+1] = k*b*m[i]; } }
  const F = v => v.toFixed(1); let d = `M${F(pts[0][0])},${F(pts[0][1])}`;
  for (let i = 0; i < n-1; i++) { const h = dx[i]/3;
    d += `C${F(pts[i][0]+h)},${F(pts[i][1]+t[i]*h)} ${F(pts[i+1][0]-h)},${F(pts[i+1][1]-t[i+1]*h)} ${F(pts[i+1][0])},${F(pts[i+1][1])}`; }
  return d;
}

function tlPicker(times, idx, label){
  const t0 = times[0], t1 = times[times.length - 1], span = Math.max(1, t1 - t0);
  return `<div class="tlpick"><button class="ghost" id="tlPrev" title="上一个" ${idx <= 0 ? "disabled" : ""}>${ic("back")}</button>
      <input type="range" id="tlR" min="0" max="${times.length - 1}" value="${idx}" step="1">
      <button class="ghost" id="tlNext" title="下一个" style="transform:scaleX(-1)" ${idx >= times.length - 1 ? "disabled" : ""}>${ic("back")}</button>
      <input type="datetime-local" id="tlDT" value="${dtLocal(times[idx])}" title="选一个时间：取那之前最后一个版本"></div>
    ${times.length <= 400 ? `<div class="tlx">${times.map((t, i) => `<i class="${i === idx ? "on" : ""}" style="left:${((t - t0) / span * 100).toFixed(2)}%"></i>`).join("")}</div>` : ""}
    <div class="tlticks"><span>${fullTime(t0)}</span><span class="tlnow">${label}</span><span>${fullTime(t1)}</span></div>`;
}
function tlWirePicker(times, set){
  const r = $("#tlR"); r.oninput = () => set(+r.value, true); r.onchange = () => set(+r.value);
  $("#tlPrev").onclick = () => set(Math.max(0, +r.value - 1)); $("#tlNext").onclick = () => set(Math.min(times.length - 1, +r.value + 1));
  $("#tlDT").onchange = e => { const t = new Date(e.target.value).getTime() / 1000; if (!t) return; let i = 0; times.forEach((x, k) => { if (x <= t + 59) i = k; }); set(i); };
}

const tlSkel = (n = 6) => `<div class="skel">${Array.from({length: n}, (_, i) => `<i style="width:${[92, 68, 80, 55, 74, 60][i % 6]}%"></i>`).join("")}</div>`;
const tlDayLab = ts => { const d = new Date(ts * 1000), t = new Date(); t.setHours(0,0,0,0); const k = Math.round((t - new Date(d).setHours(0,0,0,0)) / 86400000);
  return (k === 0 ? "今天" : k === 1 ? "昨天" : k === 2 ? "前天" : "") + ` <span class="dim">${d.getMonth()+1} 月 ${d.getDate()} 日 · 周${"日一二三四五六"[d.getDay()]}</span>`; };
const TLS_K = "ccss.tlspark";
// 对话增长曲线：x = 时间，y = 消息数；每个版本一个点；拖竖线选版本（松手才加载预览）
function tlSpark(vs, idx){
  const W = 1000, H = 64, P = 8, t0 = vs[0].at, t1 = vs[vs.length - 1].at, span = Math.max(1, t1 - t0);
  const mx = Math.max(1, ...vs.map(r => r.msgs || 0)), X = t => P + (t - t0) / span * (W - 2*P), Y = m => H - 6 - (m || 0) / mx * (H - 14);
  const pts = vs.map(r => [X(r.at), Y(r.msgs)]);
  let d = ""; pts.forEach(([x, y], i) => d += i ? `H${x.toFixed(1)}V${y.toFixed(1)}` : `M${x.toFixed(1)},${y.toFixed(1)}`);   // 阶梯：两次备份之间对话不变
  return `<div class="tlspark" id="tlSp"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path class="ln" d="${d}H${W - P}"/>
    ${pts.map(([x, y], i) => `<circle class="mk${i === idx ? " on" : ""}" data-i="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"><title>${fullTime(vs[i].at)} · ${vs[i].msgs ?? "?"} 条</title></circle>`).join("")}
    <line class="cur" x1="${pts[idx][0]}" x2="${pts[idx][0]}" y1="2" y2="${H}"/></svg><span class="knob" style="left:${(pts[idx][0] / W * 100).toFixed(2)}%">${vs[idx].msgs ?? "?"} 条</span></div>`;
}
function tlWireSpark(vs, set){
  const box = $("#tlSp"); if (!box) return;
  const svg = box.querySelector("svg"), W = 1000, P = 8, t0 = vs[0].at, span = Math.max(1, vs[vs.length - 1].at - t0);
  const near = e => { const r = svg.getBoundingClientRect(), t = t0 + ((e.clientX - r.left) / r.width * W - P) / (W - 2*P) * span;
    let b = 0; vs.forEach((v, i) => { if (Math.abs(v.at - t) < Math.abs(vs[b].at - t)) b = i; }); return b; };
  const move = i => { const x = P + (vs[i].at - t0) / span * (W - 2*P), ln = svg.querySelector("line.cur");
    ln.setAttribute("x1", x); ln.setAttribute("x2", x); box.querySelector(".knob").style.left = (x / W * 100).toFixed(2) + "%"; box.querySelector(".knob").textContent = `${vs[i].msgs ?? "?"} 条`;
    svg.querySelectorAll("circle.mk").forEach(c => c.classList.toggle("on", +c.dataset.i === i)); };
  let drag = false, last = -1;
  svg.onpointerdown = e => { drag = true; svg.setPointerCapture(e.pointerId); last = near(e); move(last); set(last, true); };
  svg.onpointermove = e => { if (!drag) return; const i = near(e); if (i !== last) { last = i; move(i); set(i, true); } };
  svg.onpointerup = e => { if (!drag) return; drag = false; set(near(e)); };
}

async function tlRestore(snaps, mode, target){
  try { const r = await api("/api/timeline/restore", {snaps, mode, target, desktop: true});
    if (r.ok === false && !(r.made || []).length) return toast("❌ " + (r.error || (r.errors || [])[0] || "没恢复成"), 6000);
    if (mode === "copy" && target === "claude") { madeDlg("✅ 已恢复到 Claude", r); SS.d = null; treeLoad(); return; }
    const q = (r.results || []).filter(x => x.deferred);
    if (!queuedAsk(q)) toast("✅ 已换回这一版（换之前的版本在备份库里，可以撤回）", 7000);
    poll(); TL.vers = null; R.timeline();
  } catch(e){ toast("❌ " + e.message, 6000); }
}

// 全部会话：选一个时间点
// 全部会话的增长曲线：x = 时间，y = 那时备份库里所有会话加起来的消息数（阶梯）；每次备份一个点；拖竖线选时间点（松手才加载）
function tlGrowth(runs, idx){
  const G = TL.grow || [], by = new Map(G.map(g => [Math.floor(g.at), g]));
  const vs = runs.map(r => by.get(Math.floor(r.at)) || {at: r.at, total: null, apps: {}});
  let lastT = 0; vs.forEach(v => { if (v.total == null) v.total = lastT; else lastT = v.total; });
  const ag = SS.agent, val = v => ag ? ((v.apps || {})[ag] || 0) : v.total;
  const W = 1000, H = 96, P = 10, t0 = vs[0].at, t1 = vs[vs.length - 1].at, span = Math.max(1, t1 - t0);
  const mx = Math.max(1, ...vs.map(val)), X = t => P + (t - t0) / span * (W - 2*P), Y = m => H - 8 - (m || 0) / mx * (H - 20);

    ${busy || dl.state === "error" ? `<div style="margin-top:10px;font-size:calc(13.5px*var(--fk))">${{downloading: "下载中", verifying: "校验 sha256", installing: "正在安装，马上重新打开…", error: "出错了：" + esc(dl.error || "")}[dl.state]}${dl.total ? ` ${kb(dl.done)} / ${kb(dl.total)}` : ""}</div><div class="prog"><i style="width:${dl.total ? Math.round(dl.done / dl.total * 100) : busy ? 100 : 0}%"></i></div>` : ""}`;
  const rb = u.rollback;                    // 0.4.2：上次更新装坏了、自动换回过
  if (rb) body = `<div class="pvl" style="margin-bottom:10px"><span class="tag warn">换回过</span><b>v${esc(rb.to)} 没成功启动，已经换回 v${esc(rb.from || u.current)}</b>
      <span class="dim">${rb.time ? esc(when(rb.time)) + " · " : ""}新版本装完后的启动自检没通过，安装程序自动换回了原来的版本，数据没动。可以再试一次，或到发布页手动下载。</span></div>` + body;
  if (u.mode === "installer") body += `<div class="dim" style="font-size:calc(12.5px*var(--fk));margin-top:8px">更新时会先留着现在的版本；新版本打不开的话自动换回来。</div>`;
  const can = u.newer && u.mode === "installer" && u.has_setup;
  $("#dlgTitle").innerHTML = ic("refresh") + " 检查更新";
  $("#dlgBody").innerHTML = body;
  $("#dlgFt").innerHTML = (u.page ? `<a href="${esc(u.page)}" target="_blank" style="margin-right:auto;font-size:calc(13.5px*var(--fk))" id="updPage">发布页</a>` : "") +
    (u.newer && u.ignored !== u.latest ? `<button class="ghost" id="updIgn">忽略此版本</button><button id="updLater">稍后</button>` : u.newer ? `<button class="ghost" id="updUnign">取消忽略</button><button onclick="closeDlg()">关闭</button>` : `<button onclick="closeDlg()">关闭</button>`) +
    `<button id="updRe">${ic("refresh")} 重新检查</button>` + (can ? `<button class="primary" id="updGo" ${busy ? "disabled" : ""}>${ic("download")} 立即更新</button>` : "");
  const on = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
  on("#updIgn", () => updIgnore(u.latest, true));
  on("#updUnign", async () => { const x = await api("/api/update/ignore", {version: null}); ST.upd = x; setBadge(x.badge); renderBans(); updRender(x); });
  on("#updLater", () => { ST.later = u.latest; sessionStorage.setItem("ccss.later", u.latest); renderBans(); closeDlg(); });
  on("#updRe", () => updOpen(true));
  on("#updGo", () => updInstall());
  on("#updPage", e => { e.preventDefault(); window.open(u.page, "_blank"); });
  if (busy) setTimeout(async () => { if (!$("#dlg").classList.contains("open")) return; try { updRender(await api("/api/update")); } catch(e){} }, 600);
}
async function updIgnore(v, inDlg){
  try { const x = await api("/api/update/ignore", {version: v}); ST.upd = x; setBadge(x.badge); renderBans(); toast(`v${v} 不再提示（更新的版本出来照样会提示）`); if (inDlg) updRender(x); } catch(e){ toast("❌ " + e.message); }
}
async function updInstall(){
  if (!$("#dlg").classList.contains("open")) openDlg("检查更新", '<div class="empty">准备…</div>');
  try { const x = await api("/api/update/install", {}); updRender(x.current ? x : await api("/api/update")); }
  catch(e){ toast("❌ " + e.message, 6000); try { updRender(await api("/api/update")); } catch(_){} }
}

// ---------- 启动 ----------
(async () => {
  const want = new URLSearchParams(location.search).get("page") || location.hash.replace("#", "") || store.get("ccss.page") || "sessions";
  try { const st = await api("/api/settings"); if (st.show_full_accounts) await rvSet(true); } catch(e){}
  rvPaint();
  await treeLoad();
  const qs = new URLSearchParams(location.search);
  const fromUrl = !!(qs.get("page") || location.hash.replace("#", ""));
  if (R[want]) goTo(want, {src: qs.get("src"), dst: qs.get("dst"), tab: qs.get("tab") || (fromUrl && want === "timeline" ? "tl" : null)}); else go("sessions");
  const dl = new URLSearchParams(location.search).get("dlg"); if (dl) ccOpen(dl);       // 老链接 ?dlg=usage 之类：现在都是页面
  try { const lg = await api("/api/legacy"); if (lg && lg.notice) { ST.legacy = lg; renderBans(); } } catch(e){}
  setTimeout(async () => { try { const f = await api("/api/formats/banner"); if (f && f.banner) { ST.fmt = f.banner; renderBans(); }
    const all = await api("/api/formats"); ST.fmtU = Object.fromEntries((all.items || []).filter(x => x.unread).map(x => [x.agent, x.unread]));
    if (PAGE === "convert" && ST.fmtU[CV.src] && !$("#cvFmtU")) R.convert(); } catch(e){} }, 1500);   // 格式自检（0.3.8）：后台查，不挡启动
  poll();
  try { const sc = await api("/api/selfcheck"); diagCnt(sc); } catch(e){}
})();

</script>
</body>
