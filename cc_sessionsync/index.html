const inTxt = t => { const d = t - Date.now() / 1000; return d <= 30 ? "马上" : d < 3600 ? Math.round(d / 60) + " 分钟后" : d < 86400 ? (d / 3600).toFixed(1) + " 小时后" : (d / 86400).toFixed(1) + " 天后"; };
R.backups = async () => {
  const pg = $("#pg-backups");
  let bk, led, jobs, bs, snaps, trash, ops, s;
  try { [bk, led, jobs, bs, snaps, trash, ops, s] = await Promise.all([api("/api/backups"), api("/api/codex/ledgers"), api("/api/jobs"), api("/api/sessions/backup-status"),
      api("/api/sessions/snapshots"), api("/api/sessions/trash"), api("/api/sessions/ops"), api("/api/settings")]); }
  catch(e){ pg.innerHTML = `<div class="miss">读不到：${esc(e.message)}</div>`; return; }
  const dled = await api("/api/dsh/ledgers").catch(() => []);
  const waiting = jobs.filter(j => j.state === "waiting"), sc = bs.sched || {};
  const JST = {waiting: ["warn", "排队中"], closing: ["warn", "正在关闭桌面端"], done: ["ok", "做完了"], failed: ["bad", "失败"], cancelled: ["", "已取消"]};
  pg.innerHTML = `<h2>${ic("download")}备份</h2><p class="sub">每次改动之前都先备份。这里能撤回同步 / 导入 / 会话操作，从回收站还原，或者从会话备份库恢复某个版本。</p>
    <div class="card" id="bkJobs"><h3>排队中的改动 <span class="tag ${waiting.length ? "warn" : ""}">${waiting.length}</span></h3>
      ${jobs.length ? `<table class="t">${jobs.slice().reverse().slice(0, 12).map(j => `<tr><td>${esc(j.title)}</td><td>${when(j.queued)}</td><td><span class="tag ${(JST[j.state] || [""])[0]}">${(JST[j.state] || ["", j.state])[1]}</span></td>
        <td class="dim ell">${esc(typeof j.result === "string" ? j.result : (j.result && (j.result.error || j.result.note)) || "")}</td><td class="nw">${j.state === "waiting" ? `<button data-crj="${esc(j.id)}" data-k="${esc(j.kind || "claude")}" title="关闭${APPN[j.kind] || "Claude"} 桌面端、做完、再按原来的方式打开它">${ic("power")} 关闭并执行</button> <button data-cj="${esc(j.id)}">取消</button>` : ""}</td></tr>`).join("")}</table>`
        : '<div class="dim" style="font-size:12.5px">没有。桌面端开着时要改它的数据，会排在这里，等它退出后自动做。</div>'}</div>
    <div class="card"><h3>${ic("history")}会话备份库<span class="sp"></span><button id="bkPrune" title="按保留规则清掉旧版本，再压缩数据库">${ic("trash")} 清理旧版本</button><button class="primary" id="bkNow">${ic("download")} 立即备份</button></h3>
      <div class="sched"><div>自动备份<b>${sc.auto ? `每 ${sc.every} ${BK_UNIT[sc.unit] || sc.unit}` : "已关"}</b>${sc.running || bs.running ? '<span class="tag warn">正在备份</span>' : ""}</div>
        <div>上次<b>${(sc.last_run || bs.last) ? when(sc.last_run || bs.last) : "还没备份过"}</b>${sc.last_error ? `<span class="tag bad" title="${esc(sc.last_error)}">失败</span>` : sc.last_result ? `新版本 ${sc.last_result.snapshots} · 看了 ${sc.last_result.files} 个` : ""}</div>
        <div>下次<b>${sc.auto ? sc.next ? inTxt(sc.next) : "马上" : "—"}</b>${sc.auto ? `${fullTime(sc.next || Date.now() / 1000).slice(5, 16)}` : "打开自动备份才会定时跑"}</div>
        <div>数据库文件<b>${kb(bs.db_bytes)}</b>${bs.sessions} 个会话 · ${bs.snapshots} 个版本</div></div>
      <div class="kv"><div>位置</div><div><code>${esc(bs.db)}</code></div><div>存储</div><div>记录原文共 ${kb(bs.raw_bytes)}，实际只存了 ${kb(bs.stored_bytes)}（每次只存追加的部分 + 相同内容只存一份 + 压缩）${bs.error ? ` <span class="tag bad">${esc(bs.error)}</span>` : ""}</div></div>
      <div class="setrow" style="margin-top:6px"><div class="sl">${ic("sync")}<div><b>定时自动备份</b><div class="sd">缺省开、每 10 分钟；最短 5 分钟。只备份变过的会话，后台低优先级跑；正在跑就跳过这一轮；睡眠 / 关机错过了，醒来补一次；失败才弹通知。</div></div></div>
        <span class="numu"><input type="number" id="bkEvery" min="1" value="${esc(s.session_backup_every ?? 10)}"><select id="bkUnit">${Object.entries(BK_UNIT).map(([k, v]) => `<option value="${k}" ${s.session_backup_unit === k ? "selected" : ""}>${v}</option>`).join("")}</select></span>${sw("bkAuto", s.session_backup_auto)}</div>
      <div class="setrow" style="border:0"><div class="sl">${ic("archive")}<div><b>保留多久</b><div class="sd">最近 N 天的版本全留；再往前到 M 天每天留最后一版；更早的每周一版。每个会话最新的一版永远留着。点「清理旧版本」才按这个删。</div></div></div>
        <span class="numu">全留 <input type="number" id="bkKeepAll" min="1" value="${esc(s.retention_all_days ?? 7)}"> 天，每天一版到 <input type="number" id="bkKeepDay" min="1" value="${esc(s.retention_daily_days ?? 90)}"> 天</span></div>
      ${snaps.items.length ? `<details style="margin-top:6px"><summary class="dim" style="cursor:pointer;font-size:12.5px">最近的 ${Math.min(snaps.items.length, 50)} 个版本</summary><div class="scroll" style="max-height:300px;margin-top:6px"><table class="t"><tr><th>会话</th><th>备份时间</th><th class="n">大小</th><th>原文件</th><th></th></tr>
        ${snaps.items.slice(0, 50).map(x => `<tr><td class="tl">${logo(x.agent)} <span class="ell" style="display:inline-block;vertical-align:bottom;max-width:300px">${esc(x.title || x.sid)}</span></td><td>${when(x.at)}</td><td class="n">${kb(x.size)}</td><td>${x.exists ? '<span class="tag ok">在</span>' : '<span class="tag warn">不在了</span>'}</td><td style="white-space:nowrap"><button data-tlo="${esc(x.agent + ":" + x.sid)}">${ic("history")} 时间线</button></td></tr>`).join("")}</table></div></details>` : ""}</div>
    <div class="card"><h3>${ic("trash")}回收站 <span class="tag">${trash.items.length}</span></h3>
      ${trash.items.length ? `<table class="t">${trash.items.map(t => `<tr><td><code>${esc(t.id)}</code></td><td>${when(t.time)}</td><td>${t.items.length} 个会话（${t.items.filter(i => i.agent === "claude").length} Claude / ${t.items.filter(i => i.agent === "codex").length} Codex）</td>
        <td>${t.restored ? `<span class="tag ok">已还原</span>` : ""}</td><td style="white-space:nowrap">${t.restored ? "" : `<button data-tr="${esc(t.id)}">${ic("undo")} 还原</button> `}<button class="ghost danger" data-tp="${esc(t.id)}">彻底删除</button></td></tr>`).join("")}</table>`
        : '<div class="dim" style="font-size:12.5px">空的。在会话管理里删除的会话会先放在这里。</div>'}</div>
    <div class="card"><h3>${ic("list")}会话操作记录（可撤回）</h3>
      ${ops.items.length ? `<table class="t">${ops.items.slice(0, 30).map(o => `<tr><td>${when(o.time)}</td><td>${esc(o.summary || o.kind)}</td><td>${o.errors.length ? `<span class="tag bad" title="${esc(o.errors.join("\n"))}">${o.errors.length} 个错误</span>` : ""}</td>
        <td>${o.undone ? '<span class="tag">已撤回</span>' : `<button data-op="${esc(o.id)}">${ic("undo")} 撤回</button>`}</td></tr>`).join("")}</table>` : '<div class="dim" style="font-size:12.5px">还没有。</div>'}</div>
    <div class="grid2"><div class="card"><h3>${ic("users")}Claude 账号同步备份</h3>
      ${bk.length ? `<table class="t">${bk.slice(0, 20).map(b => `<tr><td><code>${esc(b.id)}</code></td><td>${b.added != null ? `补 ${b.added} / 刷新 ${b.updated}` : `${b.count} 个文件`}</td><td>${b.ledger && b.ledger.restored ? '<span class="tag">已撤回</span>' : `<button data-bk="${esc(b.id)}">撤回</button>`}</td></tr>`).join("")}</table>` : '<div class="dim" style="font-size:12.5px">还没有同步过。</div>'}</div>
      <div class="card"><h3>${ic("codex", "logo")}Codex 导入账本</h3>
      ${led.length ? `<table class="t">${led.slice(0, 20).map(l => `<tr><td><code>${esc(l.id)}</code></td><td>${l.threads} 个对话 · 新建 ${l.created} / 更新 ${l.updated}</td><td>${l.undone ? '<span class="tag">已撤回</span>' : `<button data-led="${esc(l.id)}">撤回</button>`}</td></tr>`).join("")}</table>` : '<div class="dim" style="font-size:12.5px">还没有导入过。</div>'}</div></div>
    <div class="card"><h3>${ic("dsh", "logo dshc")}DeepSeek Harness 导入账本</h3>
      ${dled.length ? `<table class="t">${dled.slice(0, 20).map(l => `<tr><td><code>${esc(l.id)}</code></td><td>${l.what === "claude-to-dsh" ? "Claude Code → dsh" : "dsh → Claude Code"} · ${l.items} 个 · 新建 ${l.created} / 更新 ${l.updated}</td><td>${l.undone ? '<span class="tag">已撤回</span>' : `<button data-dled="${esc(l.id)}">撤回</button>`}</td></tr>`).join("")}</table>` : '<div class="dim" style="font-size:12.5px">还没有导入过。</div>'}
      <div class="dim" style="font-size:12px;margin-top:6px">撤回：新建的文件 / 会话目录挪进回收站（不直接删）；导过去之后又接着聊过的、dsh 正开着的，不动。</div></div>`;
  $$("[data-dled]").forEach(b => b.onclick = () => confirmDlg("撤回 DeepSeek Harness 导入", `撤回账本 <code>${esc(b.dataset.dled)}</code>：这次导入新建的会话挪进回收站，更新过的换回原来的。之后又接着聊过的不动。`, "撤回", async () => {
    try { const r = await api("/api/dsh/undo", {ledger: b.dataset.dled}); closeDlg();
      if (r.ok === false) return toast("❌ " + r.error, 5000);
      doneOrQueued(r, `已撤回（挪走 ${r.moved || 0}、换回 ${r.restored || 0}${(r.kept || []).length ? `，${r.kept.length} 个没动` : ""}）`); R.backups(); } catch(e){ toast("❌ " + e.message); } }));
  $$("[data-crj]").forEach(b => b.onclick = () => crAsk({kind: b.dataset.k, jobs: [b.dataset.crj], banner: true}));
  $$("[data-cj]").forEach(b => b.onclick = async () => { await api("/api/jobs/cancel", {id: b.dataset.cj}); toast("已取消"); poll(); R.backups(); });
  $("#bkNow").onclick = async () => { $("#bkNow").disabled = true; try { const r = await api("/api/backup/now", {}); toast(`✅ 看了 ${r.files} 个文件，新版本 ${r.snapshots} 个`); } catch(e){ toast("❌ " + e.message); } R.backups(); };
  $("#bkAuto").onchange = async e => { await saveSetting({session_backup_auto: e.target.checked}); R.backups(); };
  const bkEv = async () => { const r = await saveSetting({session_backup_every: +$("#bkEvery").value, session_backup_unit: $("#bkUnit").value}); R.backups(); };
  $("#bkEvery").onchange = bkEv; $("#bkUnit").onchange = bkEv;
  const bkKeep = async () => { await saveSetting({retention_all_days: +$("#bkKeepAll").value, retention_daily_days: +$("#bkKeepDay").value}); R.backups(); };
  $("#bkKeepAll").onchange = bkKeep; $("#bkKeepDay").onchange = bkKeep;
  $("#bkPrune").onclick = () => confirmDlg("清理旧版本", `按保留规则清掉旧版本：最近 <b>${s.retention_all_days ?? 7}</b> 天全留，<b>${s.retention_daily_days ?? 90}</b> 天内每天留最后一版，更早的每周一版；每个会话最新的一版永远留着。然后压缩数据库（现在 ${kb(bs.db_bytes)}）。<div class="dim" style="font-size:12px;margin-top:6px">只动备份库，不碰 Claude / Codex 的会话文件。</div>`, "清理", async () => {
    try { const r = await api("/api/backup/prune", {vacuum: true}); closeDlg(); toast(`✅ 清掉 ${r.snapshots_dropped} 个旧版本，数据库 ${kb(r.db_before)} → ${kb(r.db_after)}`, 6000); R.backups(); } catch(e){ toast("❌ " + e.message); } });
  $$("[data-tlo]").forEach(b => b.onclick = () => { const [a, ...i] = b.dataset.tlo.split(":"); tlOpen(a, i.join(":")); });
  $$("[data-tr]").forEach(b => b.onclick = () => confirmDlg("从回收站还原", `把 <code>${esc(b.dataset.tr)}</code> 里的会话放回去：原位置空着就放回原位；原位置已经有文件了就另存一份新的（不覆盖）。桌面端开着会排队。`, "还原", async () => {
    const r = await api("/api/sessions/trash-restore", {batch: b.dataset.tr}); closeDlg(); doneOrQueued(r, `还原了 ${r.restored || 0} 个${(r.copies || []).length ? `（${r.copies.length} 个另存为新副本）` : ""}`); R.backups(); }));
  $$("[data-tp]").forEach(b => b.onclick = () => {
    openDlg("彻底删除", `<div class="miss">彻底删除 <code>${esc(b.dataset.tp)}</code> 里的文件，<b>删了就找不回来了</b>（会话备份库里的版本不受影响）。</div>
      <div style="margin-top:10px">确认请输入 <code>DELETE</code>：</div><input id="tpIn" style="width:100%;margin-top:6px" autocomplete="off">`,
      `<button onclick="closeDlg()">取消</button><button class="primary danger" id="tpGo" disabled>彻底删除</button>`);
    $("#tpIn").oninput = e => $("#tpGo").disabled = e.target.value !== "DELETE";
    $("#tpGo").onclick = async () => { try { const r = await api("/api/sessions/trash-purge", {batch: b.dataset.tp, confirm: $("#tpIn").value}); closeDlg(); doneOrQueued(r, "已彻底删除"); R.backups(); } catch(e){ toast("❌ " + e.message); } };
  });
  $$("[data-op]").forEach(b => b.onclick = () => confirmDlg("撤回", "按账本把这次操作撤回去（改过的文件换回备份；新建的挪进回收站，不直接删）。", "撤回", async () => {
    const r = await api("/api/sessions/undo", {op: b.dataset.op}); closeDlg(); doneOrQueued(r, "已撤回"); R.backups(); }));
  $$("[data-bk]").forEach(b => b.onclick = () => confirmDlg("撤回同步", `撤回 <code>${esc(b.dataset.bk)}</code>：删掉那次补进来的登记、换回刷新前的版本（会话记录本身不动）。`, "撤回", async () => {
    const r = await api("/api/restore", {backup: b.dataset.bk}); closeDlg(); doneOrQueued(r, "已撤回"); R.backups(); }));
  $$("[data-led]").forEach(b => b.onclick = () => confirmDlg("撤回导入", `撤回 Codex 导入 <code>${esc(b.dataset.led)}</code>：新建的会话挪进回收站，更新过的换回原来的版本；导过来之后在 Claude 里接着聊过的不动。`, "撤回", async () => {
    const r = await api("/api/codex/undo", {ledger: b.dataset.led}); closeDlg(); doneOrQueued(r, `已撤回（挪走 ${r.moved || 0}、换回 ${r.restored || 0}）`); R.backups(); }));
};

// ---------- 设置 ----------
const setRow = (icn, title, desc, ctl) => `<div class="setrow"><div class="sl">${ic(icn)}<div><b>${title}</b><div class="sd">${desc}</div></div></div>${ctl}</div>`;
R.settings = async () => {
  const pg = $("#pg-settings");
  let s, u, st;
  try { [s, u, st] = await Promise.all([api("/api/settings"), api("/api/update"), api("/api/status")]); } catch(e){ pg.innerHTML = `<div class="miss">${esc(e.message)}</div>`; return; }
  ST.upd = u; setBadge(u.badge);
  const th = store.get("ccss.theme") || "system";
  const win = s.tray_supported, dis = win ? "" : "disabled";
  pg.innerHTML = `<h2>${ic("gear")}设置</h2><p class="sub">设置存在 <code>${esc(st.home)}/settings.json</code>，和 CC Msg 的互不影响。</p>
    <div class="card"><h3>外观与窗口</h3><div class="setlist">
      ${setRow("contrast", "主题", "跟随系统，或固定浅色 / 深色", `<span class="seg" id="stTheme">${[["system","跟随系统"],["light","浅色"],["dark","深色"]].map(([v,t]) => `<button data-v="${v}" class="${th===v?"on":""}">${t}</button>`).join("")}</span>`)}
      ${setRow("x", "关窗口时缩到托盘", "关掉窗口后留在通知区域继续自动同步 / 检测账号切换；托盘菜单里「退出」才真正退出" + (win ? "" : "（只有 Windows 桌面版有托盘）"), sw("stTray", s.tray_close, dis))}
      ${setRow("monitor", "启动时只放进托盘", "开机自启或双击图标时不弹窗口", sw("stMin", s.start_min, dis))}
      ${setRow("power", "开机自动启动", win ? "登录 Windows 后自动在托盘里运行（写 HKCU\\…\\Run，卸载时会删掉）" : "只有 Windows 桌面版支持", sw("stAuto", s.autostart, s.autostart_supported ? "" : "disabled"))}
      ${setRow("bell", "系统通知", "同步 / 导入做完、排队的改动做完、检测到账号切换、有新版本时在右下角弹通知", sw("stNotify", s.notify))}</div></div>
    <div class="card"><h3>同步与导入</h3><div class="setlist">
      ${setRow("sync", "自动同步 Claude 会话", "桌面端没开时把别的账号新出现的会话补进当前账号。CC Msg 里也开了的话开一个就够", sw("stSync", s.auto_sync))}
      ${setRow("shield", "导入 Codex 时登记进 Codex 导入记录", "防止 Codex 桌面端把导过去的会话再导回来（会改 ~/.codex 里那个文件，先备份）", sw("stMark", s.codex_mark_imported))}
      ${setRow("history", "会话自动备份", "把 Claude Code / Codex 的会话增量备份进 sessions.sqlite（时间线、恢复都靠它）。缺省开、每 10 分钟，最短 5 分钟；失败才弹通知", `<span class="numu"><input type="number" id="stBkE" min="1" value="${esc(s.session_backup_every ?? 10)}" ${s.session_backup_auto ? "" : "disabled"}><select id="stBkU" ${s.session_backup_auto ? "" : "disabled"}>${Object.entries(BK_UNIT).map(([k, v]) => `<option value="${k}" ${s.session_backup_unit === k ? "selected" : ""}>${v}</option>`).join("")}</select></span>${sw("stBk", s.session_backup_auto)}`)}</div></div>
    <div class="card"><h3>隐私</h3><div class="setlist">
      ${setRow("eye", "总是显示完整账号", "缺省关：账号打码显示，点眼睛临时显示（不记住，重开就又打码）。打开后每次启动都直接显示。完整账号只从本机接口（127.0.0.1 + 口令）取，不写日志；诊断报告里永远是打码的", sw("stFull", s.show_full_accounts))}</div></div>
    <div class="card"><h3>更新</h3><div class="setlist">
      ${setRow("refresh", "自动检查更新", "每 6 小时最多查一次 GitHub 发布页。<b>只提示，不会自动安装</b>：有新版本时托盘弹一次通知、按钮上出红点，点「立即更新」才下载安装", sw("stUpd", s.update_auto))}
      ${setRow("info", `当前版本 v${esc(u.current)}`, u.checked ? `上次检查 ${when(u.checked)}：${u.error ? esc(u.error) : u.newer ? `有新版本 v${esc(u.latest)}${u.ignored === u.latest ? "（已忽略）" : ""}` : "已经是最新"}` : "还没检查过",
        `<button class="tbx has-dot-able${u.badge ? " has-dot" : ""}" id="setUpd" style="position:relative;background:var(--hover);color:var(--text);padding:5px 12px">${ic("refresh")} 检查更新<span class="rdot"></span></button>`)}</div></div>
    <div class="card"><h3>数据</h3><div class="kv"><div>本程序数据</div><div><code>${esc(st.home)}</code> <button class="ghost" id="stRev" style="padding:1px 6px">${ic("folder")}</button></div>
      <div>Claude Code</div><div><code>${esc(st.claude_home)}</code></div><div>Codex</div><div><code>${esc(st.codex_home)}</code></div></div>
      <div class="dim" style="font-size:12px;margin-top:6px">目录认错了：到「诊断」里手动指定。</div></div>`;
  $$("#stTheme button").forEach(b => b.onclick = () => { applyTheme(b.dataset.v); $$("#stTheme button").forEach(x => x.classList.toggle("on", x === b)); });
  const bind = (id, key) => { const e = $(id); if (e) e.onchange = () => saveSetting({[key]: e.checked}); };
  bind("#stTray", "tray_close"); bind("#stMin", "start_min"); bind("#stAuto", "autostart"); bind("#stNotify", "notify"); bind("#stSync", "auto_sync");
  bind("#stMark", "codex_mark_imported"); bind("#stUpd", "update_auto");
  $("#stBk").onchange = e => { $("#stBkE").disabled = $("#stBkU").disabled = !e.target.checked; saveSetting({session_backup_auto: e.target.checked}); };
  const stEv = async () => { const r = await saveSetting({session_backup_every: +$("#stBkE").value, session_backup_unit: $("#stBkU").value}); if (!r) R.settings(); };
  $("#stBkE").onchange = stEv; $("#stBkU").onchange = stEv;
  $("#stFull").onchange = e => { saveSetting({show_full_accounts: e.target.checked}); rvSet(e.target.checked); };
  $("#setUpd").onclick = () => updOpen(true);
  $("#stRev").onclick = () => api("/api/reveal", {path: st.home}).catch(e => toast("❌ " + e.message));
};

// ---------- 诊断 ----------
const SC_IC = {pass: "ok", warn: "warn", fail: "err"};
function scHtml(r){
  if (!r || r.never) return '<div class="dim">还没自检过。</div>';
  const c = r.counts || {};
  return `<div class="dim" style="font-size:12px;margin-bottom:4px">${when(r.time)} · 通过 ${c.pass || 0} / 注意 ${c.warn || 0} / 没通过 ${c.fail || 0}（${r.ms} ms）</div>` +
    r.items.map(i => `<div class="sc ${i.status}">${ic(SC_IC[i.status])}<div style="min-width:0"><div class="nm">${esc(i.name)}</div><div class="dt">${esc(i.detail)}</div>${i.fix ? `<div class="fx">建议：${esc(i.fix)}</div>` : ""}</div></div>`).join("");
}
R.diag = async () => {
  const pg = $("#pg-diag");
  if (!pg.innerHTML) pg.innerHTML = '<div class="empty">检测中…</div>';
  let d, sc;
  try { [d, sc] = await Promise.all([api("/api/diag"), api("/api/selfcheck")]); if (sc.never) sc = await api("/api/selfcheck", {}); }
  catch(e){ pg.innerHTML = `<div class="miss">${esc(e.message)}</div>`; return; }
  diagCnt(sc);
  const rep = d.report, ag = (k, name) => { const a = rep[k] || {};
    return `<div class="dgag"><h4>${logo(k)} ${name} <span class="dgst${a.available ? "" : " none"}">${a.running ? "在运行" : a.available ? ({recent: "最近在用", idle: "装了"}[a.state] || "找到了") : "没找到"}</span></h4>
      <div class="why">${esc(a.why || "")}</div>
      ${a.kinds && a.kinds.length ? `<div class="dgls">认出来的形态：${esc(a.kinds.join("、"))}</div>` : ""}
      <div class="dgls">${(a.dirs || []).map(x => `<div>${x.exists ? "✓" : "✗"} ${esc(x.label)}：${esc(x.path)}${x.recent ? " · 最近写入 " + when(x.recent) : ""}</div>`).join("")}</div>
      ${(a.notes || []).length ? `<div class="dgls">${a.notes.map(n => `<div>· ${esc(n)}</div>`).join("")}</div>` : ""}</div>`; };
  const acc = d.accounts || {}, w = d.watch || {};
  const accRow = (lab, v, how, rid) => `<tr><td>${lab}</td><td>${rid && v ? acm(rid, v) + " " + eyeB() : esc(v || "—")}</td><td class="dim">${esc(how || "")}</td></tr>`;
  const dirRow = (lab, which, cur) => `<div class="dgrow"><b style="width:120px">${lab}</b><input data-dir="${which}" value="${esc(cur)}"><button data-pick="${which}">选择…</button><button data-save="${which}">保存</button><button class="ghost" data-clr="${which}" title="恢复自动检测">自动</button></div>`;
  pg.innerHTML = `<h2>${ic("activity")}诊断</h2><p class="sub">本程序怎么找到 Claude / Codex、用的哪些目录、当前是哪个账号。报告里只有打码后的账号，没有 token / key，可以直接贴给别人看。</p>
    <div class="grid2"><div class="card"><h3>${ic("ok")}自检<span class="sp"></span><button id="dgSc">${ic("refresh")} 重新自检</button><button class="ghost" id="dgScCp" title="复制自检结果">${ic("copy")}</button></h3><div id="dgScBox">${scHtml(sc)}</div></div>
      <div><div class="card"><h3>${ic("users")}账号（打码）<span class="sp"></span>${eyeB()}</h3><table class="t">
        ${accRow("Claude 桌面端", (acc.desktop || {}).email_masked || short((acc.desktop || {}).accountUuid), (acc.desktop || {}).via && "认自 " + acc.desktop.via, (acc.desktop || {}).rid)}
        ${accRow("Claude Code 命令行", (acc.cli || {}).email_masked || short((acc.cli || {}).accountUuid), (acc.cli || {}).via && "认自 " + acc.cli.via, (acc.cli || {}).rid)}
        ${accRow("Codex", (w.codex || {}).label, "auth.json + config.toml", (w.codex || {}).rid)}</table>
        <div class="dim" style="font-size:12px;margin-top:6px">账号切换检测：${w.error ? esc(w.error) : "在后台每 10 秒看一眼（只看文件修改时间，变了才读）"}${(w.last || []).length ? "；最近一次：" + esc(w.last[0].text || "") : ""}</div></div>
      <div class="card">${ag("claude", "Claude")}${ag("codex", "Codex")}</div></div></div>
    <div class="card"><h3>${ic("folder")}数据目录</h3>
      ${dirRow("Claude Code", "claude_dir", d.claude_home || "")}${dirRow("Codex", "codex_dir", d.codex_home || "")}${dirRow("Claude 桌面端", "claude_app_dir", (d.app_dirs || {}).override || "")}${dirRow("DeepSeek Harness", "dsh_home", d.dsh_home || "")}
      <div class="dgls" style="margin-top:8px">${(d.app_dirs.parts || []).map(p => `<div>桌面端${esc(p.name)}：${esc(p.path)}（${esc(p.why)}）</div>`).join("")}</div>
      <div class="dim" style="font-size:12px">留空 / 点「自动」= 自动检测。改 Claude Code / Codex 目录要重启本程序才全面生效；环境变量 CLAUDE_CONFIG_DIR / CODEX_HOME / DSH_HOME 优先。</div></div>
    ${apiCard(d.api)}
    <div class="card"><h3>${ic("text")}诊断报告<span class="sp"></span><button class="primary" id="dgCp">${ic("copy")} 复制报告</button></h3><pre class="rep" id="dgRep">${esc(d.text + "\n\n" + (sc && !sc.never ? sc.text : ""))}</pre></div>`;
  $("#dgCp").onclick = () => copyText($("#dgRep").textContent);
  $("#dgScCp").onclick = () => copyText(sc.text || "");
  $("#dgSc").onclick = async () => { $("#dgSc").disabled = true; $("#dgScBox").innerHTML = '<div class="empty">自检中…</div>'; try { sc = await api("/api/selfcheck", {}); } catch(e){ toast("❌ " + e.message); } R.diag(); };
  $$("[data-pick]").forEach(b => b.onclick = async () => { const w = b.dataset.pick, inp = $(`[data-dir="${w}"]`);
    try { const r = await api("/api/pickdir", {start: inp.value}); if (r.ok) inp.value = r.path; else if (!r.cancel) toast(r.error); } catch(e){ toast("❌ " + e.message); } });
  const saveDir = async (w, v) => { try { const r = await api(w === "claude_app_dir" ? "/api/appdir" : "/api/datadir", w === "claude_app_dir" ? {path: v} : {which: w, path: v});
      if (r.ok === false) return toast("❌ " + r.error); toast("✅ 已保存" + (r.note ? "，" + r.note : "")); SY.st = null; R.diag(); } catch(e){ toast("❌ " + e.message); } };
  $$("[data-save]").forEach(b => b.onclick = () => saveDir(b.dataset.save, $(`[data-dir="${b.dataset.save}"]`).value.trim()));
  $$("[data-clr]").forEach(b => b.onclick = () => saveDir(b.dataset.clr, ""));
};
// API 模式（3P）：桌面端用自己的推理网关 / 第三方供应商时，数据在 Claude-3p 目录；只显示供应商类型，不显示 key / 地址
function apiCard(a){
  if (!a || a.error) return a && a.error ? `<div class="card"><h3>${ic("key")}Claude 桌面端 API 模式</h3><div class="miss">${esc(a.error)}</div></div>` : "";
  const mode = a.mode === "3p" ? '<span class="tag acc">现在是 API 模式</span>' : '<span class="tag">现在是订阅登录模式</span>';
  return `<div class="card"><h3>${ic("key")}Claude 桌面端 API 模式（3P）<span class="sp"></span>${mode}</h3>
    <div class="dgls"><div>模式判断：${esc(a.mode_why || "—")}${a.mode_file ? `（<code>${esc(a.mode_file)}</code>）` : ""}</div>
      <div>在用的目录：${a.base ? `<code>${esc(a.base)}</code>` : "没找到"}${a.why ? ` · ${esc(a.why)}` : ""}</div>
      <div>供应商类型：${esc(a.provider || "—")}${a.device ? ` · 设备号 ${esc(a.device)}…` : ""}</div>
      <div>会话列表：${a.bucket ? `<code>${esc(a.bucket.path)}</code>（${a.bucket.count} 个会话${a.bucket.placeholder ? "，占位组织：所有供应商共用这一个" : ""}）` : "还没有（桌面端在 API 模式下开过 Claude Code 会话才会有；本程序不会自己建）"}</div></div>
    <table class="t" style="margin-top:6px"><tr><th>候选目录</th><th>路径</th><th class="n">会话列表</th><th></th></tr>${(a.cands || []).map(c => `<tr><td>${esc(c.label)}</td><td class="ell" title="${esc(c.path)}"><code>${esc(c.path)}</code></td><td class="n">${c.exists ? c.buckets : "—"}</td><td>${c.active ? '<span class="tag acc">在用</span>' : c.exists ? '<span class="tag">有</span>' : '<span class="dim">没有</span>'}</td></tr>`).join("")}</table></div>`;
}
function diagCnt(sc){ const n = sc && !sc.never ? (sc.counts.fail || 0) : 0, e = $("#diagCnt"); e.hidden = !n; e.textContent = n; }
// 顶栏的「自检」：弹窗里跑一遍
async function scOpen(run){
  openDlg("✅ 自检", '<div class="empty">自检中…</div>', `<button onclick="closeDlg()">关闭</button><button id="scCp">${ic("copy")} 复制</button><button class="primary" id="scRe">${ic("refresh")} 重新自检</button>`);
  let r;
  const show = () => { $("#dlgBody").innerHTML = `<div class="dim" style="font-size:12.5px;margin-bottom:6px">程序文件、数据目录写权限、凭据管理器、Claude / Codex、数据目录、更新地址。第一次启动会自动跑一次。</div>${scHtml(r)}`; diagCnt(r); };
  try { r = run ? await api("/api/selfcheck", {}) : await api("/api/selfcheck"); if (r.never) r = await api("/api/selfcheck", {}); show(); } catch(e){ $("#dlgBody").innerHTML = `<div class="miss">${esc(e.message)}</div>`; }
  $("#scRe").onclick = async () => { $("#dlgBody").innerHTML = '<div class="empty">自检中…</div>'; try { r = await api("/api/selfcheck", {}); show(); } catch(e){ toast("❌ " + e.message); } };
  $("#scCp").onclick = () => r && copyText(r.text || "");
}

// ---------- 检查更新（只提示；点「立即更新」才装）----------
async function updOpen(check){
  openDlg("检查更新", '<div class="empty">' + (check ? "正在查 GitHub 上的最新版本…" : "读取中…") + '</div>');
  let u;
  try { u = check ? await api("/api/update/check", {}) : await api("/api/update"); } catch(e){ $("#dlgBody").innerHTML = `<div class="miss">${esc(e.message)}</div>`; return; }
  ST.upd = u; setBadge(u.badge); renderBans(); updRender(u);
}
function updRender(u){
  const dl = u.download || {}, busy = ["downloading", "verifying", "installing"].includes(dl.state);
  let body;
  if (u.error && !u.latest) body = `<div class="miss">${esc(u.error)}</div>`;
  else if (!u.newer) body = `<div class="okbox">已经是最新版 v${esc(u.current)}${u.checked ? `（${when(u.checked)} 查的）` : ""}</div>`;
  else body = `<div style="display:flex;align-items:center;gap:10px"><span class="rdot" style="display:block;position:static;box-shadow:none"></span><b style="font-size:15px">有新版本 v${esc(u.latest)}</b><span class="dim">当前 v${esc(u.current)}${u.published ? " · 发布于 " + when(u.published) : ""}</span>${u.ignored === u.latest ? '<span class="tag">已忽略</span>' : ""}</div>
    ${u.notes ? `<div class="updn" style="margin-top:10px">${esc(u.notes)}</div>` : ""}
    <div class="dim" style="font-size:12.5px;margin-top:10px">${u.mode === "installer" ? (u.has_setup ? "点「立即更新」：下载安装包 → 校验 sha256 → 静默安装 → 自动重新打开。不点就不会装。" : "这个版本没有带校验文件的安装包，请到发布页手动下载。")
      : "这是 pip / 源码版：请运行 <code>pip install -U cc-sessionsync</code>，或到发布页下载 Windows 安装版。"}</div>
    ${busy || dl.state === "error" ? `<div style="margin-top:10px;font-size:12.5px">${{downloading: "下载中", verifying: "校验 sha256", installing: "正在安装，马上重新打开…", error: "出错了：" + esc(dl.error || "")}[dl.state]}${dl.total ? ` ${kb(dl.done)} / ${kb(dl.total)}` : ""}</div><div class="prog"><i style="width:${dl.total ? Math.round(dl.done / dl.total * 100) : busy ? 100 : 0}%"></i></div>` : ""}`;
  const can = u.newer && u.mode === "installer" && u.has_setup;
  $("#dlgTitle").innerHTML = ic("refresh") + " 检查更新";
  $("#dlgBody").innerHTML = body;
  $("#dlgFt").innerHTML = (u.page ? `<a href="${esc(u.page)}" target="_blank" style="margin-right:auto;font-size:12.5px" id="updPage">发布页</a>` : "") +
    (u.newer && u.ignored !== u.latest ? `<button class="ghost" id="updIgn">忽略此版本</button><button id="updLater">稍后</button>` : u.newer ? `<button class="ghost" id="updUnign">取消忽略</button><button onclick="closeDlg()">关闭</button>` : `<button onclick="closeDlg()">关闭</button>`) +
    `<button id="updRe">${ic("refresh")} 重新检查</button>` + (can ? `<button class="primary" id="updGo" ${busy ? "disabled" : ""}>${ic("download")} 立即更新</button>` : "");
  const on = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
  on("#updIgn", () => updIgnore(u.latest, true));
  on("#updUnign", async () => { const x = await api("/api/update/ignore", {version: null}); ST.upd = x; setBadge(x.badge); renderBans(); updRender(x); });
  on("#updLater", () => { ST.later = u.latest; sessionStorage.setItem("ccss.later", u.latest); renderBans(); closeDlg(); });
  on("#updRe", () => updOpen(true));
  on("#updGo", () => updInstall());
  on("#updPage", e => { e.preventDefault(); window.open(u.page, "_blank"); });
  if (busy) setTimeout(async () => { if (!$("#dlg").classList.contains("open")) return; try { updRender(await api("/api/update")); } catch(e){} }, 600);
}
async function updIgnore(v, inDlg){
  try { const x = await api("/api/update/ignore", {version: v}); ST.upd = x; setBadge(x.badge); renderBans(); toast(`v${v} 不再提示（更新的版本出来照样会提示）`); if (inDlg) updRender(x); } catch(e){ toast("❌ " + e.message); }
}
async function updInstall(){
  if (!$("#dlg").classList.contains("open")) openDlg("检查更新", '<div class="empty">准备…</div>');
  try { const x = await api("/api/update/install", {}); updRender(x.current ? x : await api("/api/update")); }
  catch(e){ toast("❌ " + e.message, 6000); try { updRender(await api("/api/update")); } catch(_){} }
}

// ---------- 启动 ----------
(async () => {
  const want = new URLSearchParams(location.search).get("page") || location.hash.replace("#", "") || store.get("ccss.page") || "sessions";
  try { const st = await api("/api/settings"); if (st.show_full_accounts) await rvSet(true); } catch(e){}
  rvPaint();
  await treeLoad();
  go(R[want] ? want : "sessions");
  const dl = new URLSearchParams(location.search).get("dlg"); if (dl) ccOpen(dl);       // 老链接 ?dlg=usage 之类：现在都是页面
  poll();
  try { const sc = await api("/api/selfcheck"); diagCnt(sc); } catch(e){}
})();

</script>
</body>
</html>
