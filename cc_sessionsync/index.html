:root{
  --bg:#faf9f5;--panel:#ffffff;--panel2:#f5f4ed;--side:#f3f1ea;--hover:#ebe8de;--hover2:#e2ded1;--bubble:#efece3;
  --line:#e3dfd3;--line2:#ece9e0;--text:#141413;--muted:#6f6d66;--faint:#a19f97;
  --accent:#c96442;--accent-weak:#f7e7df;--ink:#141413;--ink-on:#faf9f5;--claude:#c96442;--codex:#1e6b34;--cxn:#1e6b34;--dsh:#4d6bfe;
  --ok:#3f8a52;--ok-weak:#e4f1e5;--warn:#a8701c;--warn-weak:#f8eedb;--bad:#bf4b3a;--bad-weak:#f8e3df;
  --codebg:#1f1e1d;--codefg:#ebe9e1;--shadow:0 4px 20px rgba(60,48,30,.09);--r:9px;--r2:14px;
  --sans:"SS Inter","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --mono:"SS Mono",Consolas,"Cascadia Mono","SFMono-Regular",Menlo,"Microsoft YaHei UI","PingFang SC","Noto Sans SC",monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624;--panel:#30302e;--panel2:#2b2a28;--side:#1f1e1d;--hover:#353431;--hover2:#3e3d3a;--bubble:#393937;
  --line:#3b3a36;--line2:#31302d;--text:#faf9f5;--muted:#a6a39b;--faint:#77756e;
  --accent:#d97757;--accent-weak:#40302a;--ink:#faf9f5;--ink-on:#1f1e1d;--claude:#d97757;--codex:#7cc982;--cxn:#7cc982;--dsh:#8fa6ff;
  --ok:#7dbb83;--ok-weak:#26332a;--warn:#e2b25f;--warn-weak:#3a311f;--bad:#e8826f;--bad-weak:#402823;
  --codebg:#1a1918;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624;--panel:#30302e;--panel2:#2b2a28;--side:#1f1e1d;--hover:#353431;--hover2:#3e3d3a;--bubble:#393937;
  --line:#3b3a36;--line2:#31302d;--text:#faf9f5;--muted:#a6a39b;--faint:#77756e;
  --accent:#d97757;--accent-weak:#40302a;--ink:#faf9f5;--ink-on:#1f1e1d;--claude:#d97757;--codex:#7cc982;--cxn:#7cc982;--dsh:#8fa6ff;
  --ok:#7dbb83;--ok-weak:#26332a;--warn:#e2b25f;--warn-weak:#3a311f;--bad:#e8826f;--bad-weak:#402823;
  --codebg:#1a1918;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--hover2) transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:var(--hover);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:background .15s}
button:hover{background:var(--hover2)}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:var(--accent);opacity:.9}
button.ghost{background:transparent;color:var(--muted)}
button.ghost:hover{background:var(--hover);color:var(--text)}
button.danger{color:var(--bad)}button.primary.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;vertical-align:-2px}
code{font-family:var(--mono);font-size:12px;background:var(--hover);padding:1px 5px;border-radius:6px;overflow-wrap:anywhere}
a{color:var(--accent)}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.logo{width:1.05em;height:1.05em;fill:currentColor;stroke:none}
.dim{color:var(--faint)}.muted{color:var(--muted)}
.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line2);background:var(--bg);flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.brand img{width:20px;height:20px;border-radius:5px}
.brand .ver{font-weight:400;font-size:11.5px;color:var(--faint)}
.tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tab{font-size:12.5px;padding:3px 11px;border-radius:999px;background:var(--hover);color:var(--text);display:inline-flex;align-items:center;gap:6px}
.tab .ic{width:14px;height:14px;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--ink-on)}.tab.on .ic{color:var(--ink-on)}
.tab .cnt{font-size:10.5px;background:var(--accent);color:#fff;border-radius:9px;padding:0 5px;line-height:15px}
.topact{display:flex;gap:2px;align-items:center}
.tbx{position:relative;background:transparent;color:var(--muted);padding:5px 7px;border-radius:8px}
.tbx:hover{background:var(--hover);color:var(--text)}
.tbx .ic{width:17px;height:17px}
.rdot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--bg);display:none}
.has-dot>.rdot{display:block}
.main{flex:1;overflow:auto;padding:16px 20px 30px}
.page{display:none;max-width:1180px;margin:0 auto}
.page.on{display:block}
.ban{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;margin:0 auto 12px;max-width:1180px;font-size:13px;box-shadow:var(--shadow)}
.ban .ic{width:17px;height:17px;flex:none}
.ban.warn{border-color:var(--warn);background:var(--warn-weak)}.ban.warn>.ic{color:var(--warn)}
.ban.acc>.ic{color:var(--accent)}
.ban .tx{flex:1;min-width:0}.ban .tx b{font-weight:600}
.ban .acts{display:flex;gap:6px}
.ban button{padding:3px 10px;font-size:12.5px}
h2{font-size:17px;font-weight:600;margin:2px 0 4px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin-bottom:12px}
.card h3{font-size:13.5px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acct{display:flex;gap:10px;align-items:center}
.acct .av{width:34px;height:34px;border-radius:50%;background:var(--accent-weak);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.acct .nm{font-weight:600}.acct .ds{font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;border-radius:6px;padding:0 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:18px}
.tag.claude{color:var(--claude);border-color:currentColor}.tag.codex{color:var(--cxn);border-color:currentColor}.tag.dsh{color:var(--dsh,#4d6bfe);border-color:currentColor}
.ic.logo.dshc{color:var(--dsh,#4d6bfe)}
.tag.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-weak)}.tag.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-weak)}
.tag.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-weak)}.tag.acc{color:var(--accent);border-color:var(--accent);background:var(--accent-weak)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
table.t th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel);z-index:1}
table.t tr:last-child td{border-bottom:0}
table.t tr.sel td{background:var(--accent-weak)}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--hover)}
table.t td.n{text-align:right;white-space:nowrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
#ssList .tl .ell,#ssList .tl .s{max-width:250px}#ssList td:last-child{white-space:nowrap}#ssList .tag.warn{max-width:74px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.tl{font-weight:500}.tl .s{display:block;font-weight:400;font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar .sp{flex:1}
.bar input[type=search]{width:240px}
.seg{display:inline-flex;border-radius:999px;background:var(--hover);padding:2px}
.seg button{border-radius:999px;background:transparent;padding:3px 12px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
.scroll{max-height:calc(100vh - 290px);overflow:auto;border:1px solid var(--line2);border-radius:10px}
.pv{max-height:calc(100vh - 250px);overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{border-radius:12px;padding:8px 11px;font-size:13px;white-space:pre-wrap;word-break:break-word;max-width:100%}
.msg.user{background:var(--bubble);align-self:flex-end;max-width:88%}
.msg.assistant{background:transparent;border:1px solid var(--line2)}
.msg.tool{font:12px/1.45 var(--mono);color:var(--muted);padding:2px 6px;border:0}
.msg .who{font-size:11px;color:var(--faint);margin-bottom:2px;font-family:var(--sans)}
.empty{color:var(--faint);text-align:center;padding:28px 10px;font-size:13px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:12.5px}.kv>div:nth-child(odd){color:var(--muted)}
.batch{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line2);font-size:12.5px}
.switch{position:relative;display:inline-block;width:36px;height:20px;flex:none}
.switch input{display:none}.switch i{position:absolute;inset:0;border-radius:20px;background:var(--hover2);transition:.15s;cursor:pointer}
.switch i:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.15s}
.switch input:checked+i{background:var(--accent)}.switch input:checked+i:after{left:18px}
.chk{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.chk label{display:inline-flex;gap:6px;align-items:center}
.sc{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line2)}
.sc:last-child{border-bottom:0}.sc .ic{width:17px;height:17px;margin-top:2px}
.sc.pass .ic{color:var(--ok)}.sc.warn .ic{color:var(--warn)}.sc.fail .ic{color:var(--bad)}
.sc .nm{font-weight:600;font-size:13px}.sc .dt{font-size:12px;color:var(--muted);word-break:break-all}.sc .fx{font-size:12px;color:var(--warn)}
pre.rep{white-space:pre-wrap;font:12px/1.5 var(--mono);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px;max-height:340px;overflow:auto;margin:0}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.dlg.open{display:flex}
.dlg .box{background:var(--panel);border-radius:16px;border:1px solid var(--line2);box-shadow:var(--shadow);width:min(620px,100%);max-height:85vh;display:flex;flex-direction:column}
.dlg .hd{padding:16px 20px 6px;font-weight:600;display:flex;align-items:center}
.dlg .hd button{margin-left:auto}
#dlgTitle{display:inline-flex;align-items:center;gap:8px}
.dlg .bd{padding:8px 20px 12px;overflow:auto}
.dlg .ft{padding:10px 20px 18px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.dlg.wide .box{width:min(1100px,100%);height:88vh;max-height:88vh}
.dlg pre{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;margin:0}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 16px;font-size:13px;z-index:40;display:none;max-width:90vw;align-items:center;gap:8px}
.toast[style*="block"]{display:flex!important}
.menu{position:relative}
.menu .list{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:160px;display:none;z-index:20}
.menu.open .list{display:block}
.menu .list button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:7px 10px}
.menu .list button:hover{background:var(--hover)}
.miss{background:var(--warn-weak);border:1px solid var(--warn);border-radius:8px;padding:6px 10px;font-size:12.5px}
.okbox{background:var(--ok-weak);border:1px solid var(--ok);border-radius:8px;padding:6px 10px;font-size:12.5px}
.diff{font:12px/1.5 var(--mono)}.diff .a{color:var(--ok)}.diff .u{color:var(--warn)}
.updn{white-space:pre-wrap;font-size:12.5px;max-height:240px;overflow:auto;background:var(--panel2);border-radius:10px;padding:8px 10px;border:1px solid var(--line2)}
.prog{height:6px;border-radius:6px;background:var(--hover);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--accent);width:0}
@media (max-width:900px){.split,.grid2{grid-template-columns:1fr}.brand .ver{display:none}}
/* 下面这些从 CC Msg 搬来：设置行、诊断卡片、用量统计、模型与 API */
.setlist{display:flex;flex-direction:column;gap:2px;min-width:min(460px,80vw)}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow .sl{display:flex;gap:10px;align-items:flex-start;flex:1 1 200px;min-width:0}
.setrow .sl .ic{width:16px;height:16px;color:var(--muted);margin-top:2px;flex:none}
.setrow .sd{font-size:12px;color:var(--muted);margin-top:1px}
.setrow .seg{flex:none}
.setrow .seg button{font-size:12.5px;padding:4px 12px}
.dgag{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:0 0 10px}
.dgag h4{margin:0 0 4px;font-size:13.5px;display:flex;align-items:center;gap:8px}.dgag .why{font-size:12.5px;margin:0 0 6px}
.dgst{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--accent-weak);color:var(--accent)}.dgst.none{background:var(--warn-weak);color:var(--warn)}
.dgls{font-size:11.5px;color:var(--muted);margin:4px 0;font-family:var(--mono,monospace);word-break:break-all}.dgls div{padding:1px 0}
.dgrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 2px;font-size:12.5px}.dgrow input{flex:1;min-width:180px;font-size:12px;padding:4px 7px}
/* 0.5.0 用量统计 */
.us{display:flex;flex-direction:column;gap:12px}
.us .uhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.us .usrc{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.us .usrc i.d{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.us .usrc.busy i.d{background:var(--warn);animation:usb 1s infinite alternate}
@keyframes usb{to{opacity:.3}}
.us .uhd .sp{flex:1}
.us .ufl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.us .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.us .seg button{border:0;border-radius:0;background:transparent;padding:4px 12px;color:var(--muted)}
.us .seg button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.us .ucards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.us .ucard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);min-width:0}
.us .ucard .k{color:var(--muted);font-size:12.5px}
.us .ucard .v{font-size:22px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.us .ucard .s{color:var(--faint);font-size:11.5px;margin-top:2px}
.us .note{color:var(--warn);font-size:11.5px}
.us .uchart{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2)}
.us .uchart .ct{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12.5px;color:var(--muted)}
.us .uchart svg{width:100%;height:170px;display:block}
.us .uchart rect.b{fill:var(--accent);opacity:.8}
.us .uchart rect.b:hover{opacity:1}
.us .uchart text{fill:var(--faint);font-size:10px}
.us .uchart line{stroke:var(--line2)}
.us .uchart{position:relative}
.us .uchart .ct{flex-wrap:wrap}
.us .seg.sty button,.us .seg[data-ser] button{padding:3px 9px;font-size:12px}

.skel{display:flex;flex-direction:column;gap:10px;padding:12px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--hover),var(--line),var(--hover));background-size:200% 100%;animation:skel 1.2s linear infinite}
@keyframes skel{to{background-position:-200% 0}}
.emp{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--faint);padding:40px 16px;text-align:center;font-size:13px}
.emp .ic{width:30px;height:30px;color:var(--line)}
.sched{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0}
.sched>div{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.sched b{display:block;font-size:13.5px;color:var(--text);font-weight:600;margin-top:2px}
.numu{display:inline-flex;gap:6px;align-items:center}.numu input{width:70px}
/* ---- v0.2.2：顶部按钮栏 + 左侧只放会话列表 ---- */
button.brand{background:transparent;padding:3px 6px;border-radius:8px;font-size:14px}
button.brand:hover{background:var(--hover)}
.pnav{display:flex;gap:2px;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none;margin-left:6px}
.pb{position:relative;display:inline-flex;align-items:center;gap:5px;background:transparent;color:var(--muted);padding:5px 9px;border-radius:8px;font-size:12.5px}
.pb .ic{width:15px;height:15px}
.pb:hover{background:var(--hover);color:var(--text)}
.pb.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}.pb.on .ic{color:var(--accent)}
.pb .cnt{font-size:10.5px;background:var(--accent);color:#fff;border-radius:9px;padding:0 5px;line-height:15px}
.pb .rdot{top:3px;right:3px}
.tbx.on{background:var(--hover);color:var(--accent)}
@media (max-width:1180px){.pb>span:not(.cnt):not(.rdot){display:none}.pb{padding:5px 7px}}
.sh{padding:10px 10px 6px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--line2);flex:none}
.sht{display:flex;align-items:center;gap:7px;cursor:pointer;padding:2px 4px;border-radius:7px}
.sht .ic{width:16px;height:16px;color:var(--muted)}
.sht b{font-size:13.5px}.sht em{font-style:normal;font-size:11px;color:var(--faint)}
.sht .sp{flex:1}
.side.on .sht .ic:first-child{color:var(--accent)}
button.sm{padding:2px 5px}button.sm .ic{width:14px;height:14px}
.side .gsearch{width:auto;padding-right:3px}
.sfl{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sfl .seg button{font-size:11.5px;padding:1px 8px}
.sfl select{font-size:11.5px;padding:2px 4px;flex:1 1 76px;min-width:76px}
.tn.leaf{padding-left:8px}
.tn.leaf .lb{font-weight:400}
.tn.leaf .n{font-size:10.5px}
.tn.more{color:var(--faint);font-size:11.5px;padding-left:22px}
.pgv h2{margin-bottom:4px}
.pgv>.card{padding:14px 16px}
.pvhd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pvft{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px}

/* v0.2.3：关闭桌面端并执行 */
.cr{display:flex;flex-direction:column;gap:10px;font-size:13px}
.cr .crq{display:flex;align-items:center;gap:8px;margin:0;font-size:14.5px}.cr .crq .ic{color:var(--warn);width:18px;height:18px}
.cr .crk{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cr .crk>span:nth-child(odd){color:var(--muted)}.cr .crk>span:nth-child(even){word-break:break-all}
.cr ul{margin:4px 0 0;padding-left:18px}.cr ul li{margin:2px 0;font-size:12px}.cr code{font-size:11.5px;word-break:break-all}
.cr .crok{border:1px solid var(--ok);background:var(--ok-weak);border-radius:10px;padding:8px 10px;font-size:12.5px}
.cr .crok .ic{width:14px;height:14px;color:var(--ok);vertical-align:-2px}
.crs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.crs li{display:flex;align-items:center;gap:8px;color:var(--muted)}.crs li.cur{color:var(--text);font-weight:600}.crs li.cur .dim{font-weight:400}
.crs li.bad{color:var(--bad)}.crs li.bad .ic{width:16px;height:16px}.crs li.ok{color:var(--text)}.crs li.ok .ic{color:var(--ok);width:16px;height:16px}
.crs .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);margin:0 4px}
.crs .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:crspin .8s linear infinite;margin:0 1px}
@keyframes crspin{to{transform:rotate(360deg)}}
.crbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.crbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.crj{list-style:none;padding:0 !important}.crj li{display:flex;gap:6px;align-items:baseline}
td.nw{white-space:nowrap}
#mdCr{margin-left:6px;padding:1px 8px;font-size:12px}
</style>

<div class="app" id="app">
  <header class="top">
    <button class="tbx" id="tbSide" title="收起 / 展开会话列表（Ctrl+B）"><i data-ic="panelL"></i></button>

      <button class="pb" data-p="timeline" title="时间线：选一个时间点，预览、恢复"><i data-ic="history"></i><span>时间线</span></button>

      <button class="pb" data-p="backups" title="备份与还原"><i data-ic="download"></i><span>备份</span></button>

      <button class="pb" data-p="models" title="供应商（模型与 API）"><i data-ic="key"></i><span>供应商</span></button>
      <button class="pb" data-p="diag" title="诊断与自检"><i data-ic="activity"></i><span>诊断自检</span><span class="cnt" id="diagCnt" hidden></span></button>
      <button class="pb" id="tbUpd" title="检查更新"><i data-ic="refresh"></i><span>检查更新</span><span class="rdot"></span></button>
    </nav>
    <span class="sp"></span>
    <div class="topact">
      <button class="tbx" id="tbTheme" title="主题"></button>
      <button class="tbx" id="tbSet" data-p="settings" title="设置"><i data-ic="gear"></i></button>
    </div>
  </header>
  <div class="body">
    <aside class="side" id="side">
      <div class="sh">
        <div class="sht" id="sdHead" title="回到会话"><i data-ic="list"></i><b>会话</b><em id="nvSess"></em><span class="sp"></span>
          <button class="ghost sm" id="sdImp" title="导入 .md / .html，变成新的 Claude Code 会话"><i data-ic="upload"></i></button>
          <button class="ghost sm" id="sdRef" title="刷新"><i data-ic="refresh"></i></button></div>
        <label class="gsearch" title="搜标题 / 第一句 / 目录 / id；Ctrl+Enter 在内容里搜"><i data-ic="search"></i><input type="search" id="gQ" placeholder="搜会话（Ctrl+K）"><button class="ghost sm" id="sdFt" title="在全部会话内容里搜（Ctrl+Enter）"><i data-ic="text"></i></button></label>
        <div class="sfl"><span class="seg" id="sdAg"><button data-v="" class="on">全部</button><button data-v="claude">Claude</button><button data-v="codex">Codex</button><button data-v="dsh" title="DeepSeek Harness">DeepSeek</button></span>
          <select id="sdDate" title="时间"><option value="">不限时间</option><option value="1">今天</option><option value="7">7 天</option><option value="30">30 天</option></select>
          <select id="sdStat" title="归档"><option value="live">没归档</option><option value="archived">已归档</option><option value="all">全部</option></select></div>
      </div>
      <div class="trh"><span>分组</span><button class="eye" id="trEye" title="显示完整账号"></button><span class="sp"></span><span class="seg" id="trMode"><button data-m="acct">按账号</button><button data-m="proj">按项目</button></span></div>
      <div class="tree" id="tree"><div class="hint">读取中…</div></div>
    </aside>
    <div class="grip" id="sideGrip" title="拖动调整宽度"></div>
    <main class="main" id="main">
      <div id="bans"></div>
      <section class="page full" id="pg-sessions"></section>
      <section class="page full" id="pg-timeline"></section>
      <section class="page" id="pg-sync"></section>
      <section class="page" id="pg-codex"></section>
      <section class="page" id="pg-dsh"></section>
      <section class="page" id="pg-backups"></section>
      <section class="page full" id="pg-usage"></section>
      <section class="page full" id="pg-models"></section>
      <section class="page" id="pg-settings"></section>
      <section class="page" id="pg-diag"></section>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="dlg" id="dlg"><div class="box">
  <div class="hd"><span id="dlgTitle"></span><button class="ghost" onclick="closeDlg()"><i data-ic="x"></i></button></div>
  <div class="bd" id="dlgBody"></div>
  <div class="ft" id="dlgFt"><button onclick="closeDlg()">关闭</button></div>
</div></div>

const TR = {mode: store.get("ccss.trmode") === "proj" ? "proj" : "acct", sel: null, open: new Set(JSON.parse(store.get("ccss.tropen") || "[]"))};
const trSave = () => store.set("ccss.tropen", JSON.stringify([...TR.open].slice(-200)));

function treeRender(){
  const box = $("#tree"); if (!box || !SS.d) return;

  const items = ssVisible(true), groups = SS.d.groups || [];

    return `<div class="tn${on ? " on" : ""}" data-id="${esc(id)}" data-sel="${esc(JSON.stringify(sel))}"><span class="tw${kids ? open ? " open" : "" : " none"}"${kids ? ` data-tw="${esc(id)}"` : ""}>${ic("chev")}</span>${extra}<span class="lb">${label}</span><span class="n">${n}</span></div>` +
      (kids && open ? `<div class="tk">${kids()}</div>` : "");
  };
  // 最里层：会话本身（点了在右边打开）
  const LIM = 80;
  const leaves = (xs, sel) => xs.slice().sort((a, b) => (b.last || 0) - (a.last || 0)).slice(0, LIM).map(x => { const k = skey(x);
    return `<div class="tn leaf${SS.cur && skey(SS.cur) === k ? " on" : ""}" data-sk="${esc(k)}" title="${esc((x.title || "（无标题）") + "\n" + (x.cwd || ""))}">${logo(x.agent)}<span class="lb">${esc(x.title || "（无标题）")}</span><span class="n">${when(x.last)}</span></div>`; }).join("") +
    (xs.length > LIM ? `<div class="tn more" data-sel="${esc(JSON.stringify(sel))}">还有 ${xs.length - LIM} 个：在右边列表里看…</div>` : "");
  const gLabel = g => g.kind === "unknown" ? `<span title="${esc(g.hint || "")}">未知账号</span>` : g.kind === "api" || g.kind === "dsh" ? `<span title="${esc(g.hint || "")}">${esc(g.masked)}</span>` : acm(g.rid, g.masked, true);
  const gIcon = g => g.kind === "dsh" ? ic("dsh", "logo lg dshc") : g.kind === "codex" ? ic("codex", "logo lg") : g.kind === "claude" ? ic("claude", "logo lg") : g.kind === "api" ? ic("key", "lg") : ic("user", "lg");
  const gTags = g => g.current ? `<span class="cur" title="${esc((g.tags || []).join("、"))}">当前</span>` : "";
  const pLabel = p => `<span title="${esc(p)}">${esc(projName(p) || "（没有目录）")}</span>`;
  let html = node("all", null, "全部会话", items.length, null, ic("list", "lg"));
  if (TR.mode === "acct") {
    for (const g of groups) {
      const xs = items.filter(x => x.gacct === g.key);

      html += `<div title="${esc(tip)}">` + node("a:" + g.key, {acct: g.key}, gLabel(g) + gTags(g), xs.length, xs.length ? () => byProj(xs).map(([p, n]) => {
        const sel = {acct: g.key, proj: p}; return node("a:" + g.key + "|" + p, sel, pLabel(p), n, () => leaves(xs.filter(x => (x.cwd || "") === p), sel), ic("folder", "lg")); }).join("") : null, gIcon(g)) + `</div>`;
    }

      const xs = items.filter(x => (x.cwd || "") === p);
      html += node("p:" + p, {proj: p}, pLabel(p), n, () => {
        const m = new Map(); for (const x of xs) m.set(x.gacct, (m.get(x.gacct) || 0) + 1);
        return [...m].sort((a, b) => b[1] - a[1]).map(([k, c]) => { const g = trGroup(k) || {key: k, kind: "unknown", masked: "未知账号"}, sel = {acct: k, proj: p};
          return node("p:" + p + "|" + k, sel, gLabel(g) + gTags(g), c, () => leaves(xs.filter(x => x.gacct === k), sel), gIcon(g)); }).join("");
      }, ic("folder", "lg"));
    }

  $$("#tree .tn[data-sel]").forEach(t => t.onclick = () => { TR.sel = JSON.parse(t.dataset.sel); if (TR.sel && t.dataset.id) { TR.open.add(t.dataset.id); trSave(); } treeRender(); trApply(); });

    if (PAGE !== "sessions") go("sessions"); else { ssList(); ssView(a, i.join(":")); } treeRender(); });
  rvPaint();
}

    out.push(`<div class="ban warn" data-ak="${esc(a.k)}">${ic("users")}<div class="tx"><b>${esc(a.title)}</b>：${a.old != null && a.new != null ? `${acm(a.old_rid, a.old)} → ${acm(a.new_rid, a.new)} ${eyeB()}` : esc(a.text)}</div>

  else if (ST.jobs) out.push(`<div class="ban">${ic("pause")}<div class="tx">${ST.jobs} 个改动在排队：等${ST.jobKinds.map(k => APPN[k] || k).join(" / ")} 桌面端完全退出后自动做（会弹通知）</div><div class="acts">${ST.jobKinds.map(k => `<button class="primary" data-crk="${esc(k)}">${ic("power")} 关闭 ${APPN[k] || k} 并执行（完成后重启）</button>`).join("")}<button data-j="1">查看</button></div></div>`);

  $$("#bans [data-a]").forEach(b => b.onclick = async () => {
    const box = b.closest("[data-ak]"), k = box.dataset.ak, a = ST.acct.find(x => x.k === k);

    const page = a && a.open && a.open.page || "sync";

function setBadge(on){ $("#tbUpd").classList.toggle("has-dot", !!on); const s = $("#setUpd"); if (s) s.classList.toggle("has-dot", !!on); }
let pollT;
async function poll(){
  clearTimeout(pollT);
  try {
    const t = await api("/api/tray?since=" + ST.seq);
    const first = ST.seq < 0;
    ST.seq = t.seq;
    let jobDone = false;
    for (const e of t.events || []) {
      if (e.kind === "account" && (!first || Date.now() / 1000 - e.time < 600)) {
        const k = (e.open && e.open.account_switch) || e.title;
        ST.acct = ST.acct.filter(x => x.k !== k); ST.acct.unshift({k, time: e.time, title: e.title, text: e.text, open: e.open, old: e.old, new: e.new, old_rid: e.old_rid, new_rid: e.new_rid, mode: e.mode_switch});
        RV.loaded = false; if (RV.on) rvLoad().then(rvPaint).catch(() => {}); if (!first) { SS.d = null; treeLoad(); }
      } else if (e.kind === "job") jobDone = true;
      else if (e.kind === "auto-sync" && !first && !e.manual) toast("🔄 " + e.title);
    }
    const hd = t.acct_handled || {};          // 同步过 / 不缺会话了：这条切换算处理完，提示条收起
    ST.acct = ST.acct.filter(a => !(hd[a.k] && hd[a.k] >= (a.time || 0)));
    ST.jobs = t.jobs; ST.jobKinds = t.job_kinds || ["claude"]; ST.cr = t.closerun || null;
    if (!ST.upd || (t.update && (t.update.badge !== ST.upd.badge || t.update.latest !== ST.upd.latest))) ST.upd = await api("/api/update");
    setBadge(ST.upd && ST.upd.badge);
    renderBans();
    if (jobDone && !first) { toast("✅ 排队的改动做完了"); if (R[PAGE] && !$("#dlg").classList.contains("open")) R[PAGE](true); }
  } catch(e){}
  pollT = setTimeout(poll, document.hidden ? 15000 : 5000);
}

function usRange(){

function usQs(){

const US_CK = "ccss.uscache";
function usCacheGet(){
  const qk = usQs().replace(/(from|to)=\d+&?/g, "");           // 时间窗按「7 天」这类选项比，不按具体秒数
  if (US.c && US.c.q === qk + US.range) return US.c;
  try { const j = JSON.parse(localStorage.getItem(US_CK) || "null"); if (j && j.q === qk + US.range && j.sum && j.st) return US.c = j; } catch(e){}
  return null;
}
function usCachePut(){
  US.c = {q: usQs().replace(/(from|to)=\d+&?/g, "") + US.range, sum: US.sum, st: US.st, logs: US.logs.slice(0, 100), total: US.total, at: Date.now()};

}

    US.sum = s; US.st = st; usHead(); usCards(); usChart(); usDist(); usOpts(); usMissing();

function usBuckets(){
  const s = US.sum, [f] = usRange(), first = f || (s.series[0] ? s.series[0].h : Date.now()/1000), now = Date.now()/1000;
  const byDay = now - first > 2.2 * 86400, step = byDay ? 86400 : 3600;
  const key = ts => { const d = new Date(ts*1000); if (byDay) d.setHours(0,0,0,0); else d.setMinutes(0,0,0); return d.getTime()/1000; };
  const Z = () => ({n:0, tok:0, cost:0, inp:0, cr:0, cw5:0, cw1h:0, out:0, c_in:0, c_cr:0, c_cw5:0, c_cw1h:0, c_out:0, unpriced:0, apps:{}, models:{}, projs:{}});
  const buckets = new Map();
  for (let ts = key(first); ts <= now; ts = key(ts + step + (byDay ? 7200 : 0))) buckets.set(ts, Z());
  const addMap = (dst, src) => { for (const [k, v] of Object.entries(src || {})) { const a = dst[k] || (dst[k] = [0, 0, 0]); a[0] += v[0]; a[1] += v[1]; a[2] += v[2]; } };
  const src = byDay && s.days ? s.days : s.series;
  for (const r of src) { const k = key(r.h); const b = buckets.get(k) || Z();
    for (const x of ["n","tok","cost","inp","cr","cw5","cw1h","out","c_in","c_cr","c_cw5","c_cw1h","c_out","unpriced"]) b[x] += r[x] || 0;
    addMap(b.apps, r.apps); addMap(b.models, r.models); addMap(b.projs, r.projs); buckets.set(k, b); }
  const arr = [...buckets.entries()].sort((a, b) => a[0] - b[0]).slice(-120);
  const lab = ts => { const d = new Date(ts*1000); return byDay ? `${d.getMonth()+1}/${d.getDate()}` : `${pad(d.getHours())}:00`; };
  const title = ts => byDay ? new Date(ts*1000).toLocaleDateString("zh-CN") : new Date(ts*1000).toLocaleString("zh-CN", {hour12: false});
  return {arr, byDay, lab, title};
}
// 单调三次样条：平滑但不越过数据（不会画出负数）
function usMono(pts){
  const n = pts.length; if (!n) return ""; if (n === 1) return `M${pts[0][0]},${pts[0][1]}`;
  const dx = [], m = [], t = [];
  for (let i = 0; i < n-1; i++) { dx[i] = pts[i+1][0] - pts[i][0]; m[i] = (pts[i+1][1] - pts[i][1]) / (dx[i] || 1); }
  t[0] = m[0]; t[n-1] = m[n-2];
  for (let i = 1; i < n-1; i++) t[i] = m[i-1] * m[i] <= 0 ? 0 : (m[i-1] + m[i]) / 2;
  for (let i = 0; i < n-1; i++) { if (!m[i]) { t[i] = 0; t[i+1] = 0; continue; }
    const a = t[i]/m[i], b = t[i+1]/m[i], h = a*a + b*b; if (h > 9) { const k = 3/Math.sqrt(h); t[i] = k*a*m[i]; t[i+1] = k*b*m[i]; } }
  const F = v => v.toFixed(1); let d = `M${F(pts[0][0])},${F(pts[0][1])}`;
  for (let i = 0; i < n-1; i++) { const h = dx[i]/3;
    d += `C${F(pts[i][0]+h)},${F(pts[i][1]+t[i]*h)} ${F(pts[i+1][0]-h)},${F(pts[i+1][1]-t[i+1]*h)} ${F(pts[i+1][0])},${F(pts[i+1][1])}`; }
  return d;
}
// 曲线图：多条平滑曲线 + 渐变填充、悬停显示准确数值、点图例开关。xs: [{ts}], series: [{k, name, vals}]
function usCurve(box, xs, series, o){
  const el = box.querySelector(".ucv-body"), leg = box.querySelector(".uleg"), tip = box.querySelector(".utip");
  const hide = USS.hide[o.id] || (USS.hide[o.id] = {});
  const vis = series.filter(s => !hide[s.k]);
  const W = 1000, H = 190, L = 54, B = 18, T = 8, n = xs.length;
  const max = Math.max(1e-9, ...vis.flatMap(s => s.vals));
  const RP = 26, X = i => L + (n <= 1 ? (W-L)/2 : i * (W - L - RP) / (n - 1)), Y = v => (H - B) - v / max * (H - B - T);
  const gid = "g" + o.id;
  let g = `<defs>${series.map((s, j) => `<linearGradient id="${gid}${j}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--u${s.c||j+1});stop-opacity:.32"/><stop offset="1" style="stop-color:var(--u${s.c||j+1});stop-opacity:0"/></linearGradient>`).join("")}</defs>`;
  g += [0, .25, .5, .75, 1].map(p => `<line class="gl" x1="${L}" x2="${W}" y1="${Y(max*p)}" y2="${Y(max*p)}"/><text x="${L-5}" y="${Y(max*p) + 3}" text-anchor="end">${o.fmt(max*p)}</text>`).join("");
  const every = Math.ceil(n / 12);
  g += xs.map((x, i) => i % every === 0 ? `<text x="${X(i)}" y="${H-4}" text-anchor="middle">${o.lab(x.ts)}</text>` : "").join("");
  series.forEach((s, j) => { if (hide[s.k]) return;
    const pts = s.vals.map((v, i) => [X(i), Y(v)]), d = usMono(pts);
    if (!s.noFill) g += `<path class="ar" d="${d}L${X(n-1)},${H-B}L${X(0)},${H-B}Z" fill="url(#${gid}${j})"/>`;
    g += `<path class="ln${s.dash ? " dash" : ""}" d="${d}" style="stroke:var(--u${s.c||j+1})"/>`; });
  g += `<line class="hl" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none"/><g class="dots"></g><rect class="hit" x="${L}" y="0" width="${W-L}" height="${H}" fill="transparent"/>`;
  el.innerHTML = vis.length ? `<svg class="ucv" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>` : `<div class="uempty">图例全关了，点下面的图例打开</div>`;
  leg.innerHTML = series.map((s, j) => `<button data-k="${esc(s.k)}" class="${hide[s.k] ? "off" : ""}" title="点一下显示 / 隐藏"><i style="background:var(--u${s.c||j+1})"></i>${esc(s.name)}</button>`).join("");
  leg.querySelectorAll("button").forEach(b => b.onclick = () => { hide[b.dataset.k] ? delete hide[b.dataset.k] : (hide[b.dataset.k] = 1); ussSave(); usCurve(box, xs, series, o); });
  const svg = el.querySelector("svg"); if (!svg) { tip.style.display = "none"; return; }
  const hl = svg.querySelector(".hl"), dots = svg.querySelector(".dots");
  svg.querySelector(".hit").onmousemove = e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round(n <= 1 ? 0 : (vx - L) / ((W - L - RP) / (n - 1)))));
    hl.setAttribute("x1", X(i)); hl.setAttribute("x2", X(i)); hl.style.display = "";
    dots.innerHTML = vis.map(s => `<circle cx="${X(i)}" cy="${Y(s.vals[i])}" r="3.5" style="fill:var(--u${s.c||series.indexOf(s)+1})"/>`).join("");
    tip.innerHTML = `<b>${esc(o.title(xs[i].ts))}</b>` + vis.map(s => `<div><i style="background:var(--u${s.c||series.indexOf(s)+1})"></i>${esc(s.name)}<span>${o.full(s.vals[i])}</span></div>`).join("") + (o.extra ? o.extra(i) : "");
    tip.style.display = "block";
    const br = box.getBoundingClientRect(); let lx = e.clientX - br.left + 14;
    if (lx + tip.offsetWidth > br.width - 4) lx = e.clientX - br.left - tip.offsetWidth - 14;
    tip.style.left = Math.max(4, lx) + "px"; tip.style.top = Math.max(4, e.clientY - br.top - tip.offsetHeight / 2) + "px";
  };
  svg.querySelector(".hit").onmouseleave = () => { tip.style.display = "none"; hl.style.display = "none"; dots.innerHTML = ""; };
}

  if (cs.installed) out.push({s: "检测到 CC Switch", h: `检测到 <b>CC Switch</b>${cs.current && Object.keys(cs.current).length ? "（当前 " + Object.entries(cs.current).filter(([a]) => a === "claude" || a === "codex").map(([a, n]) => `${esc(a)} → <b>${esc(n)}</b>`).join("，") + "）" : ""}。CC Session Sync 自己就能管供应商，CC Switch 不是必须的；但<b>在 CC Switch 里切换会覆盖 CC Session Sync 设的值</b>（Codex 的整个 config.toml 都会被它换掉）。<a href="#" data-mcgo="ccs">把它的供应商导入过来…</a>`});
  for (const t of ["claude", "codex"]) if (MC.p[t + "_drift"]) out.push({s: `${PV_TOOL[t]} 配置被改过`, h: `${PV_TOOL[t]} 的全局配置已经被别的工具改过${cs.installed ? "（多半是 CC Switch 切换了）" : ""}，和 CC Session Sync 记的不一致，所以列表里没有标「在用」。要用 CC Session Sync 的，点一下那个供应商。`});
  const on = [run.claude && "Claude", run.codex && "Codex"].filter(Boolean);
  if (on.length) out.push({s: `${on.join("、")} 在运行，改动要重开会话`, h: `${on.join("、")} 正在运行：改动只对<b>之后新开的会话</b>生效；已经开着的会话要重开，Claude 桌面版 / Codex 桌面版要退出后重开。`});
  if (d.plaintext.length) out.push({s: `${d.plaintext.length} 个明文 key`, h: `配置文件里有 <b>${d.plaintext.length}</b> 个明文 key：${d.plaintext.map(p => `${esc(p.tool)} <code>${esc(p.field)}</code>（${esc(p.masked)}）`).join("，")}。<a href="#" data-mcgo="migrate">挪进凭据管理器…</a>（先备份，你点了才做）`});
  return out;
}

async function mcSave(tool, base, extra = {}, ctx = null){
  ctx = ctx || {scope: "user", root: cur && cur.root, file: MC.d[tool].user.file, box: "#mcTab", back: () => mcOpen()};
  const now = mcCollect(ctx.box), changes = {};
  for (const [k, v] of Object.entries(now)) if (k !== "_key" && String(base[k] ?? "") !== v) changes[k] = v || null;
  if (tool === "claude" && "_key" in now && (base._key || "") !== now._key) changes.apiKeyHelper = now._key || null;
  if (!Object.keys(changes).length && !extra.provider_auth) return toast("没有改动");
  const lines = Object.entries(changes).map(([k, v]) => `<li><code>${esc(k)}</code>：${esc(String(base[k === "apiKeyHelper" ? "_key" : k] ?? "（不设）"))} → <b>${esc(v ?? "（删掉）")}</b></li>`).join("");
  const warn = [];
  if (changes.apiKeyHelper) warn.push("设了 apiKeyHelper 后，Claude Code 会<b>改用这个 key 按 API 计费</b>，不再走 claude.ai 订阅额度；Claude 桌面版的会话也会受影响。");
  if ("ANTHROPIC_BASE_URL" in changes && MC.d.ccswitch.installed) warn.push("CC Switch 还装着：它下次切换供应商时会覆盖这里的改动。");
  if (changes.model && tool === "claude") warn.push("主模型只对命令行和新会话生效；Claude 桌面版按它自己的模型选择。");
  openDlg("确认写入", `<div>将改 <code>${esc(ctx.file)}</code>（先备份，写完核对）：</div><ul>${lines || "<li>供应商的取 key 方式</li>"}</ul>${warn.map(w => `<div class="miss" style="margin-top:6px">${w}</div>`).join("")}`,
    '<button id="pvNo">取消</button><button class="primary" id="mcGo">写入</button>');
  $("#pvNo").onclick = () => ctx.back();
  $("#mcGo").onclick = async () => {
    try { const r = await api("/api/modelcfg/" + tool, {scope: ctx.scope, root: ctx.root, changes, ...extra});
      toast(r.ok ? `已写入，备份 ${r.backup || "（原来没有这个文件）"}` : "写入后核对不一致，请到 ⋯ →「备份 / 恢复」还原"); }
    catch(e){ toast("没写成：" + e.message); }
    await ctx.back();
  };
}

// 模型输入框的下拉：获取到的模型在前（可搜索），常见名字垫底；输入框本身照样能随便填
function pvCombo(inputs, getList){
  let dd = $("#pvDD"); if (!dd) { dd = document.createElement("div"); dd.id = "pvDD"; dd.className = "pvdd"; document.body.appendChild(dd);
    document.addEventListener("scroll", e => { if (!dd.contains(e.target)) (pvCombo.onScroll || (() => dd.style.display = "none"))(e); }, true); }
  let cur = null, sel = -1;
  const hide = () => { dd.style.display = "none"; cur = null; sel = -1; };
  const show = inp => { cur = inp; const q = inp.value.trim().toLowerCase(), got = getList(), seen = new Set(), rows = [];
    for (const [x, g] of [...got.map(x => [x, 1]), ...MODEL_SUGG.map(x => [x, 0])]) if (!seen.has(x) && (!q || x.toLowerCase().includes(q))) { seen.add(x); rows.push([x, g]); }
    if (!rows.length || (rows.length === 1 && rows[0][0] === inp.value)) { dd.style.display = "none"; return; }
    const r = inp.getBoundingClientRect();
    dd.style.cssText = `display:block;left:${r.left}px;top:${r.bottom + 2}px;min-width:${r.width}px`;
    dd.innerHTML = (got.length ? "" : '<div class="pvddh">还没获取模型列表，下面是常见名字</div>') + rows.slice(0, 80).map(([x, g], i) => `<div class="pvddi${i === sel ? " on" : ""}" data-v="${esc(x)}">${esc(x)}${g ? "" : '<span class="dim">常见</span>'}</div>`).join("");
    const b = dd.getBoundingClientRect(); if (b.bottom > innerHeight - 8) dd.style.top = Math.max(8, r.top - 2 - b.height) + "px"; };
  dd.onmousedown = e => { const it = e.target.closest(".pvddi"); if (!it || !cur) return; e.preventDefault(); cur.value = it.dataset.v; cur.dispatchEvent(new Event("change")); hide(); };
  const attach = list => { for (const inp of list) {
    inp.addEventListener("focus", () => { sel = -1; show(inp); });
    inp.addEventListener("input", () => { sel = -1; show(inp); });
    inp.addEventListener("blur", () => setTimeout(() => { if (cur === inp) hide(); }, 120));
    inp.addEventListener("keydown", e => { const its = [...dd.querySelectorAll(".pvddi")]; if (dd.style.display !== "block" || !its.length) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : its.length - 1)) % its.length; its.forEach((x, i) => x.classList.toggle("on", i === sel)); its[sel].scrollIntoView({block: "nearest"}); }
      else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); inp.value = its[sel].dataset.v; hide(); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); hide(); } });
  } };
  attach(inputs);
  pvCombo.attach = attach;
  pvCombo.onScroll = e => { if (cur && e.target.contains && e.target.contains(cur) && document.activeElement === cur) show(cur); else { dd.style.display = "none"; } };   // 对话框滚动：跟着输入框走                    // 表格里新加的行也接上同一个下拉
  pvCombo.refresh = () => { if (cur) show(cur); };
  return hide;
}

const CX = {rows: [], sel: new Set(), q: "", days: "30", cwd: "", state: "", all: false, pv: null, desktop: true, reasoning: false, plan: null};
const CX_LAB = {new: ["ok", "新导入"], update: ["warn", "有新内容"], same: ["", "导过了"], diverged: ["bad", "Claude 里接着聊过"]};
function cxQs(only){
  const p = new URLSearchParams({days: CX.days, desktop: CX.desktop ? "1" : "0", reasoning: CX.reasoning ? "1" : "0"});
  if (CX.all) p.set("all", "1"); if (only) p.set("only", only.join(","));
  return p.toString();
}
R.codex = async (keep) => {
  const pg = $("#pg-codex");
  if (!CX.plan) pg.innerHTML = '<div class="empty">读取 Codex 对话…</div>';
  let pl, s;
  try { [pl, s] = await Promise.all([api("/api/codex/plan?" + cxQs()), api("/api/settings")]); }
  catch(e){ pg.innerHTML = `<div class="miss">读不到：${esc(e.message)}</div>`; return; }
  CX.plan = pl; CX.rows = pl.rows || []; CX.mark = !!s.codex_mark_imported;
  const ids = new Set(CX.rows.map(r => r.thread)); for (const t of [...CX.sel]) if (!ids.has(t)) CX.sel.delete(t);
  if (!CX.touched) CX.rows.forEach(r => { if (r.state === "new" || r.state === "update") CX.sel.add(r.thread); });
  const projs = [...new Set(CX.rows.map(r => r.cwd).filter(Boolean))].sort();
  const c = pl.counts || {};
  pg.innerHTML = `<h2>${ic("codex", "logo")}Codex → Claude Code</h2>
    <p class="sub">把 Codex 的对话转成 Claude Code 的会话记录，之后在 Claude Code 里 <code>/resume</code> 或桌面端列表里接着聊。只读 Codex 的数据；写之前先演练，看清楚会改哪些文件再导；每次导入都有账本，可以撤回。</p>
    <div class="bar"><input type="search" id="cxQ" placeholder="搜标题 / 目录 / 线程号" value="${esc(CX.q)}">
      <select id="cxDays">${[["7","最近 7 天"],["30","最近 30 天"],["90","最近 90 天"],["0","全部"]].map(([v,t]) => `<option value="${v}" ${CX.days===v?"selected":""}>${t}</option>`).join("")}</select>
      <select id="cxCwd"><option value="">全部项目</option>${projs.map(p => `<option value="${esc(p)}" ${CX.cwd===p?"selected":""}>${esc(projName(p))}</option>`).join("")}</select>
      <span class="seg" id="cxSt">${[["","全部"],["new","新"],["update","有新内容"],["same","导过了"],["diverged","不动"]].map(([v,t]) => `<button data-v="${v}" class="${CX.state===v?"on":""}">${t}${v && c[v] ? " " + c[v] : ""}</button>`).join("")}</span>
      <label class="chk" title="连子代理 / codex exec / 从 Claude 导进 Codex 的也列出来"><input type="checkbox" id="cxAll" ${CX.all?"checked":""}> 含子代理等</label></div>
    <div class="split"><div class="card" style="padding:0;overflow:hidden"><div class="scroll" id="cxList" style="border:0;border-radius:0"></div>
      <div class="batch"><span id="cxN"></span><span class="sp" style="flex:1"></span><button id="cxDry">${ic("eye")} 演练：看会改什么</button><button class="primary" id="cxGo">${ic("download")} 导入选中的</button></div></div>
      <div class="card" id="cxPv"><div class="empty">点左边一行，在这里预览导过去的样子</div></div></div>
    <div class="card"><h3>导入选项</h3><div class="setrow"><div class="sl">${ic("monitor")}<div><b>写进 Claude 桌面端的会话列表</b><div class="sd">关掉就只写命令行能 <code>claude --resume</code> 的记录；桌面端开着时写列表要等它退出（会排队）</div></div></div>${sw("cxDesk", CX.desktop)}</div>
      <div class="setrow"><div class="sl">${ic("sparkles")}<div><b>带上 Codex 的思考摘要</b><div class="sd">只有明文摘要的才有；加密的思考内容永远导不过来</div></div></div>${sw("cxReas", CX.reasoning)}</div>
      <div class="setrow"><div class="sl">${ic("shield")}<div><b>防止 Codex 再导回去（登记进 Codex 导入记录）</b><div class="sd">Codex 桌面端开了「从 Claude Code 导入」时，免得它把导过去的会话再导回一份重复的。会改 <code>~/.codex/external_agent_session_imports.json</code>（先备份，撤回时还原）。缺省关。</div></div></div>${sw("cxMark", CX.mark)}</div></div>`;
  cxList();
  $("#cxQ").oninput = e => { CX.q = e.target.value; cxList(); };
  $("#cxDays").onchange = e => { CX.days = e.target.value; CX.touched = false; R.codex(); };
  $("#cxCwd").onchange = e => { CX.cwd = e.target.value; cxList(); };
  $$("#cxSt button").forEach(b => b.onclick = () => { CX.state = b.dataset.v; $$("#cxSt button").forEach(x => x.classList.toggle("on", x === b)); cxList(); });
  $("#cxAll").onchange = e => { CX.all = e.target.checked; R.codex(); };
  $("#cxDesk").onchange = e => { CX.desktop = e.target.checked; };
  $("#cxReas").onchange = e => { CX.reasoning = e.target.checked; if (CX.pv) cxPreview(CX.pv); };
  $("#cxMark").onchange = e => saveSetting({codex_mark_imported: e.target.checked}).then(() => { CX.mark = e.target.checked; });
  $("#cxDry").onclick = () => cxDry(false);
  $("#cxGo").onclick = () => cxDry(true);
  if (CX.pv && ids.has(CX.pv)) cxPreview(CX.pv);
};
function cxVisible(){
  const q = CX.q.trim().toLowerCase();
  return CX.rows.filter(r => (!CX.state || r.state === CX.state) && (!CX.cwd || r.cwd === CX.cwd) &&
    (!q || [r.title, r.cwd, r.thread].some(v => String(v || "").toLowerCase().includes(q))));
}
function cxList(){
  const rows = cxVisible();
  $("#cxList").innerHTML = rows.length ? `<table class="t"><tr><th style="width:28px"><input type="checkbox" id="cxAllSel"></th><th>对话</th><th class="n">轮</th><th>最近</th><th>状态</th></tr>
    ${rows.map(r => `<tr class="click${CX.pv === r.thread ? " sel" : ""}" data-t="${esc(r.thread)}"><td><input type="checkbox" data-c="${esc(r.thread)}" ${CX.sel.has(r.thread) ? "checked" : ""} ${r.state === "diverged" ? "disabled" : ""}></td>
      <td class="tl"><div class="ell">${esc(r.title || "（无标题）")}${r.archived ? ' <span class="tag">已归档</span>' : ""}</div><span class="s">${esc(r.cwd || "")} · ${esc(r.thread.slice(-6))}</span></td>
      <td class="n">${r.turns ?? "—"}</td><td class="n">${when(r.mtime)}</td><td><span class="tag ${CX_LAB[r.state][0]}">${CX_LAB[r.state][1]}</span></td></tr>`).join("")}</table>`
    : `<div class="empty">${CX.rows.length ? "没有符合筛选的对话" : "这段时间里没有 Codex 对话（换个时间范围试试）"}</div>`;
  $$("#cxList [data-c]").forEach(c => { c.onclick = e => e.stopPropagation(); c.onchange = () => { CX.touched = true; c.checked ? CX.sel.add(c.dataset.c) : CX.sel.delete(c.dataset.c); cxN(); }; });
  $$("#cxList tr[data-t]").forEach(tr => tr.onclick = () => cxPreview(tr.dataset.t));
  const a = $("#cxAllSel"); if (a) { a.checked = rows.length && rows.every(r => CX.sel.has(r.thread) || r.state === "diverged");
    a.onchange = () => { CX.touched = true; rows.forEach(r => { if (r.state !== "diverged") a.checked ? CX.sel.add(r.thread) : CX.sel.delete(r.thread); }); cxList(); }; }
  cxN();
}
function cxN(){ const n = CX.sel.size; $("#cxN").textContent = n ? `已选 ${n} 个` : "勾选要导入的对话"; $("#cxGo").disabled = $("#cxDry").disabled = !n; }
async function cxPreview(t){
  CX.pv = t; $$("#cxList tr[data-t]").forEach(tr => tr.classList.toggle("sel", tr.dataset.t === t));
  const box = $("#cxPv"); box.innerHTML = '<div class="empty">生成预览…</div>';
  try {
    const p = await api(`/api/codex/preview?id=${encodeURIComponent(t)}&reasoning=${CX.reasoning ? 1 : 0}`);
    if (!p.ok) { box.innerHTML = `<div class="miss">${esc(p.error)}</div>`; return; }
    const s = p.stats || {};
    box.innerHTML = `<h3>${esc(p.title)}<span class="sp"></span><span class="tag">${p.turns_total} 轮</span></h3>
      <div class="dim" style="font-size:12px;margin:-4px 0 8px">${esc(p.cwd)} → <code>${esc(p.target || "")}</code><br>工具调用 ${s.tools || 0}${s.images ? ` · 图片 ${s.images}（导不过去，留文字说明）` : ""}${s.reasoning_encrypted ? ` · 加密思考 ${s.reasoning_encrypted}（导不过去）` : ""}${s.compactions ? ` · 压缩过 ${s.compactions} 次` : ""}</div>
      <div class="pv">${p.turns.map(m => `<div class="msg ${m.role === "user" ? "user" : "assistant"}"><div class="who">${m.role === "user" ? "你" : "Codex → Claude"}${m.ts ? " · " + when(m.ts) : ""}</div>${esc(m.text)}${m.cut ? '<span class="dim">…（预览截短）</span>' : ""}</div>`).join("")}
      ${p.more ? `<div class="dim" style="text-align:center;font-size:12px">后面还有 ${p.more} 轮（导入时全导）</div>` : ""}</div>`;
  } catch(e){ box.innerHTML = `<div class="miss">预览失败：${esc(e.message)}</div>`; }
}
async function cxDry(thenApply){
  const only = [...CX.sel];
  let r;
  try { r = await api("/api/codex/plan?" + cxQs(only) + (CX.mark ? "&mark=1" : "&mark=0")); } catch(e){ return toast("❌ " + e.message); }
  const todo = r.rows.filter(x => x.state === "new" || x.state === "update");
  const c = r.counts || {};
  const mk = r.mark_check || {};
  const html = `<div class="kv"><div>会新建</div><div><b>${c.new || 0}</b> 个 Claude Code 会话</div><div>会更新</div><div><b>${c.update || 0}</b> 个（Codex 那边有新内容，旧版本留在账本里）</div>
      <div>不动</div><div>${(c.same || 0) + (c.diverged || 0)} 个（导过了没变 / 已在 Claude 里接着聊过）</div>
      <div>桌面端列表</div><div>${r.desktop ? `写进当前账号 <code>${esc(short(r.desktop.key))}…</code>` : esc(r.desktop_note || "不写（只写命令行记录）")}</div>
      <div>防重复导入</div><div>${r.mark ? (mk.ok ? `登记进 <code>${esc(mk.file)}</code>（${mk.exists ? "先备份再改" : "新建"}）` : `<span style="color:var(--bad)">${esc(mk.error || "")}</span>`) : "关"}</div></div>
    <div class="diff updn" style="margin-top:10px">${todo.length ? todo.map(x => `<div class="${x.state === "new" ? "a" : "u"}">${x.state === "new" ? "+ 新建" : "~ 更新"}  ${esc(x.target || "")}/…jsonl   ${esc(x.title || "")}  (${x.turns} 轮 / ${Math.round((x.chars || 0) / 1000)}K 字)</div>`).join("") : "（没有要写的）"}</div>
    <div class="dim" style="font-size:12px;margin-top:8px">这是演练，还什么都没写。${CX.desktop && SY.st && SY.st.running.claude ? "Claude 桌面端开着：确认后会排队，退出桌面端后自动导入。" : ""}</div>`;
  openDlg(thenApply ? "确认导入" : "演练结果", html, `<button onclick="closeDlg()">${thenApply ? "取消" : "关闭"}</button>${todo.length && !(r.mark && !mk.ok) ? `<button class="primary" id="cxApply">${ic("download")} 确认导入 ${todo.length} 个</button>` : ""}`);
  const b = $("#cxApply");
  if (b) b.onclick = async () => {
    b.disabled = true;
    try {
      const x = await api("/api/codex/import", {days: CX.days, only, all: CX.all ? 1 : 0, desktop: CX.desktop ? 1 : 0, reasoning: CX.reasoning ? 1 : 0, mark: CX.mark ? 1 : 0});
      closeDlg();
      if (doneOrQueued(x, `导入了 ${x.done || 0} 个（账本 ${x.ledger || ""}，可在「备份与还原」撤回）`)) { CX.touched = false; R.codex(); }
    } catch(e){ b.disabled = false; toast("❌ " + e.message, 5000); }
  };
}

// ---------- DeepSeek Harness ⇄ Claude Code ----------
const DS = {dir: "to-claude", plan: null, sel: new Set(), touched: false, q: "", reasoning: false, images: false, desktop: true, again: false, det: null};
const DS_LAB = {new: ["ok", "新导入"], update: ["warn", "有新内容"], same: ["", "导过了"], diverged: ["bad", "Claude 里接着聊过"], changed: ["warn", "Claude 里又聊过"],
  empty: ["", "空会话"], error: ["bad", "读不了"]};
const dsCan = r => DS.dir === "to-claude" ? (r.state === "new" || r.state === "update") : (r.state === "new" || (DS.again && r.state === "changed"));
R.dsh = async () => {
  const pg = $("#pg-dsh");
  if (!DS.plan) pg.innerHTML = '<div class="empty">读取 DeepSeek Harness…</div>';
  let det, pl;
  try { [det, pl] = await Promise.all([api("/api/dsh/detect"), api(`/api/dsh/plan?dir=${DS.dir}&again=${DS.again ? 1 : 0}`)]); }
  catch(e){ pg.innerHTML = `<div class="miss">读不到：${esc(e.message)}</div>`; return; }
  DS.det = det; DS.plan = pl;
  const rows = pl.rows || [], ids = new Set(rows.map(r => r.id));
  for (const t of [...DS.sel]) if (!ids.has(t)) DS.sel.delete(t);
  if (!DS.touched) rows.forEach(r => { if (dsCan(r)) DS.sel.add(r.id); });
  const to = DS.dir === "to-claude", rt = (det.roots || [])[0] || {};
  pg.innerHTML = `<h2>${ic("dsh", "logo")}DeepSeek Harness ⇄ Claude Code</h2>
    <p class="sub">把 DeepSeek Harness（dsh）的会话转成 Claude Code 会话，或者反过来。只读对方的数据；先演练，每次导入都有账本可以撤回。导进 dsh 时<b>只新建会话</b>，已有的 dsh 会话一个字节都不碰。</p>
    <div class="card"><h3>${ic("activity")}检测</h3><div class="dgls">
      <div>数据目录：<code>${esc(det.home)}</code> ${det.home_exists ? "✓" : "✗ 没有"}${det.home_env ? "（来自环境变量 DSH_HOME）" : ""}</div>
      <div>会话根：${rt.root ? `<code>${esc(rt.root)}</code>` : "—"}${rt.why ? `（${esc(rt.why)}）` : ""} · 压缩 ${esc(rt.compression || "—")}${rt.found_encoding ? ` · 现有会话 ${esc(rt.found_encoding)}` : ""}</div>
      <div>桌面版：${det.install ? `${esc(det.install.version || "版本不明")} · <code>${esc(det.install.dir)}</code>` : "没找到安装"} · ${det.running ? `<span class="tag warn">在运行（${det.procs} 个进程）</span>` : "没在运行"}</div>
      ${det.zstd ? "" : '<div class="miss">缺 zstandard 模块：读不了 / 写不了压缩的 dsh 会话</div>'}</div></div>
    <div class="bar"><span class="seg" id="dsDir"><button data-v="to-claude" class="${to ? "on" : ""}">dsh → Claude Code</button><button data-v="from-claude" class="${to ? "" : "on"}">Claude Code → dsh</button></span>
      <input type="search" id="dsQ" placeholder="搜标题 / 目录 / 会话号" value="${esc(DS.q)}"><span class="sp"></span>
      ${pl.error ? `<span class="tag bad">${esc(pl.error)}</span>` : ""}</div>
    <div class="card" style="padding:0;overflow:hidden"><div class="scroll" id="dsList" style="border:0;border-radius:0;max-height:52vh"></div>
      <div class="batch"><span id="dsN"></span><span style="flex:1"></span><button id="dsDry">${ic("eye")} 演练：看会改什么</button><button class="primary" id="dsGo">${ic("download")} 导入选中的</button></div></div>
    <div class="card"><h3>导入选项</h3>${to ? `
      <div class="setrow"><div class="sl">${ic("monitor")}<div><b>写进 Claude 桌面端的会话列表</b><div class="sd">关掉就只写命令行能 <code>claude --resume</code> 的记录；桌面端开着时会排队</div></div></div>${sw("dsDesk", DS.desktop)}</div>
      <div class="setrow"><div class="sl">${ic("sparkles")}<div><b>带上思考内容（当文字）</b><div class="sd">缺省不带：dsh 的思考内容不能变成 Claude 的思考块，只能当普通文字放进回复里</div></div></div>${sw("dsReas", DS.reasoning)}</div>
      <div class="setrow"><div class="sl">${ic("file")}<div><b>图片按原样带过去</b><div class="sd">缺省只留「[图片]」占位；打开后 dsh 附件库里找得到的图片按 base64 嵌进去（会话文件会变大）</div></div></div>${sw("dsImg", DS.images)}</div>`
    : `<div class="setrow"><div class="sl">${ic("refresh")}<div><b>Claude 里又聊过的，再导一份新的</b><div class="sd">已经导过去的那份不改（不往已有的 dsh 会话里写）；勾上就把现在的内容另导成一个新的 dsh 会话</div></div></div>${sw("dsAgain", DS.again)}</div>
      <div class="dim" style="font-size:12.5px">只带文字：工具调用和结果变成文字摘要，图片变成占位，思考内容不带。导进去的会话标题带「（Claude Code）」，在 dsh 里接着聊会用 dsh 当前的模型。${det.running ? "dsh 开着也可以导（只新建目录）；它的会话列表可能要重开一下才看得到。" : ""}</div>`}</div>`;
  dsList();
  $$("#dsDir button").forEach(b => b.onclick = () => { if (DS.dir === b.dataset.v) return; DS.dir = b.dataset.v; DS.sel.clear(); DS.touched = false; DS.plan = null; R.dsh(); });
  $("#dsQ").oninput = e => { DS.q = e.target.value; dsList(); };
  const on = (id, k, re) => { const e = $(id); if (e) e.onchange = ev => { DS[k] = ev.target.checked; if (re) { DS.touched = false; DS.sel.clear(); R.dsh(); } }; };
  on("#dsDesk", "desktop"); on("#dsReas", "reasoning"); on("#dsImg", "images"); on("#dsAgain", "again", true);
  $("#dsDry").onclick = () => dsDry(false); $("#dsGo").onclick = () => dsDry(true);
};
function dsList(){
  const q = DS.q.trim().toLowerCase(), all = (DS.plan && DS.plan.rows) || [];
  const rows = all.filter(r => !q || [r.title, r.cwd, r.id].some(v => String(v || "").toLowerCase().includes(q)));
  $("#dsList").innerHTML = rows.length ? `<table class="t"><tr><th style="width:28px"><input type="checkbox" id="dsAll"></th><th>会话</th><th class="n">${DS.dir === "to-claude" ? "消息" : ""}</th><th>最近</th><th>状态</th></tr>
    ${rows.map(r => `<tr><td><input type="checkbox" data-c="${esc(r.id)}" ${DS.sel.has(r.id) ? "checked" : ""} ${dsCan(r) ? "" : "disabled"}></td>
      <td class="tl"><div class="ell">${logo(DS.dir === "to-claude" ? "dsh" : "claude")} ${esc(r.title || "（无标题）")}</div><span class="s">${esc(r.cwd || "")} · ${esc(String(r.id).slice(-8))}${r.error ? " · " + esc(r.error) : ""}</span></td>
      <td class="n">${r.msgs ?? ""}</td><td class="n">${r.last ? when(r.last) : "—"}</td><td><span class="tag ${(DS_LAB[r.state] || [""])[0]}">${(DS_LAB[r.state] || ["", r.state])[1]}</span></td></tr>`).join("")}</table>`
    : `<div class="empty">${all.length ? "没有符合筛选的会话" : DS.dir === "to-claude" ? "没找到 DeepSeek Harness 的会话" : "没有 Claude Code 会话"}</div>`;
  $$("#dsList [data-c]").forEach(c => c.onchange = () => { DS.touched = true; c.checked ? DS.sel.add(c.dataset.c) : DS.sel.delete(c.dataset.c); dsN(); });
  const a = $("#dsAll"); if (a) { a.checked = rows.length && rows.every(r => DS.sel.has(r.id) || !dsCan(r));
    a.onchange = () => { DS.touched = true; rows.forEach(r => { if (dsCan(r)) a.checked ? DS.sel.add(r.id) : DS.sel.delete(r.id); }); dsList(); }; }
  dsN();
}
function dsN(){ const n = DS.sel.size; $("#dsN").textContent = n ? `已选 ${n} 个` : "勾选要导入的会话"; $("#dsGo").disabled = $("#dsDry").disabled = !n || !!(DS.plan && DS.plan.error); }
async function dsDry(thenApply){
  const only = [...DS.sel], to = DS.dir === "to-claude";
  let r;
  try { r = await api(`/api/dsh/plan?dir=${DS.dir}&only=${encodeURIComponent(only.join(","))}&again=${DS.again ? 1 : 0}&reasoning=${DS.reasoning ? 1 : 0}&images=${DS.images ? 1 : 0}`); }
  catch(e){ return toast("❌ " + e.message); }
  const todo = (r.rows || []).filter(dsCan), bad = todo.filter(x => x.error || x.valid === false);
  const st = x => { const s = x.stats || {}; return [s.tools ? `工具 ${s.tools}` : "", s.images ? `图片 ${s.images}` : "", s.reasoning ? `思考 ${s.reasoning}` : "", s.skipped ? `跳过 ${s.skipped}` : ""].filter(Boolean).join(" · "); };
  const html = `<div class="kv"><div>方向</div><div>${to ? "DeepSeek Harness → Claude Code" : "Claude Code → DeepSeek Harness（只新建）"}</div>

    ln.setAttribute("x1", x); ln.setAttribute("x2", x); box.querySelector(".knob").style.left = (x / W * 100).toFixed(2) + "%"; box.querySelector(".knob").textContent = `${vs[i].msgs ?? "?"} 条`;

// 全部会话：选一个时间点
// 全部会话的增长曲线：x = 时间，y = 那时备份库里所有会话加起来的消息数（阶梯）；每次备份一个点；拖竖线选时间点（松手才加载）
function tlGrowth(runs, idx){
  const G = TL.grow || [], by = new Map(G.map(g => [Math.floor(g.at), g]));
  const vs = runs.map(r => by.get(Math.floor(r.at)) || {at: r.at, total: null, apps: {}});
  let lastT = 0; vs.forEach(v => { if (v.total == null) v.total = lastT; else lastT = v.total; });
  const ag = SS.agent, val = v => ag ? ((v.apps || {})[ag] || 0) : v.total;
  const W = 1000, H = 96, P = 10, t0 = vs[0].at, t1 = vs[vs.length - 1].at, span = Math.max(1, t1 - t0);
  const mx = Math.max(1, ...vs.map(val)), X = t => P + (t - t0) / span * (W - 2*P), Y = m => H - 8 - (m || 0) / mx * (H - 20);
  const pts = vs.map(v => [X(v.at), Y(val(v))]);
  const step = ps => ps.map(([x, y], i) => i ? `H${x.toFixed(1)}V${y.toFixed(1)}` : `M${x.toFixed(1)},${y.toFixed(1)}`).join("") + `H${W - P}`;
  const apps = ag ? [] : [["claude", "var(--claude)"], ["codex", "var(--cxn)"], ["dsh", "var(--dsh,#4d6bfe)"]].filter(([k]) => vs.some(v => (v.apps || {})[k]));
  const lab = i => `${val(vs[i]).toLocaleString()} 条`;
  return `<div class="tlspark tlgrow" id="tlGr"><div class="tlglab"><b>全部会话的消息总数</b>${ag ? `（只算 ${esc(APPN[ag] || ag)}）` : ""} · 现在 ${val(vs[vs.length - 1]).toLocaleString()} 条
      ${apps.length > 1 ? apps.map(([k, c]) => `<span class="tlgk"><i style="background:${c}"></i>${esc(APPN[k])}</span>`).join("") : ""}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${apps.length > 1 ? apps.map(([k, c]) => `<path class="ln sub" style="stroke:${c}" d="${step(vs.map(v => [X(v.at), Y((v.apps || {})[k] || 0)]))}"/>`).join("") : ""}
    <path class="ln" d="${step(pts)}"/>
    ${pts.map(([x, y], i) => `<circle class="mk${i === idx ? " on" : ""}" data-i="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"><title>${fullTime(vs[i].at)} · ${lab(i)}（这次存了 ${runs[i].n} 个新版本）</title></circle>`).join("")}
    <line class="cur" x1="${pts[idx][0]}" x2="${pts[idx][0]}" y1="2" y2="${H}"/></svg><span class="knob" style="left:${(pts[idx][0] / W * 100).toFixed(2)}%">${lab(idx)}</span></div>`;
}
function tlWireGrowth(runs, set){
  const box = $("#tlGr"); if (!box) return;
  const svg = box.querySelector("svg"), W = 1000, P = 10, t0 = runs[0].at, span = Math.max(1, runs[runs.length - 1].at - t0);
  const near = e => { const r = svg.getBoundingClientRect(), t = t0 + ((e.clientX - r.left) / r.width * W - P) / (W - 2*P) * span;
    let b = 0; runs.forEach((v, i) => { if (Math.abs(v.at - t) < Math.abs(runs[b].at - t)) b = i; }); return b; };
  const move = i => { const c = svg.querySelector(`circle.mk[data-i="${i}"]`), x = +c.getAttribute("cx"), ln = svg.querySelector("line.cur");
    ln.setAttribute("x1", x); ln.setAttribute("x2", x); const k = box.querySelector(".knob"); k.style.left = (x / W * 100).toFixed(2) + "%";
    k.textContent = c.querySelector("title").textContent.split(" · ")[1].split("（")[0];
    svg.querySelectorAll("circle.mk").forEach(m => m.classList.toggle("on", m === c)); };
  let drag = false, last = -1;
  svg.onpointerdown = e => { drag = true; svg.setPointerCapture(e.pointerId); last = near(e); move(last); set(last, true); };
  svg.onpointermove = e => { if (!drag) return; const i = near(e); if (i !== last) { last = i; move(i); set(i, true); } };
  svg.onpointerup = e => { if (!drag) return; drag = false; set(near(e)); };
}
