name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install -e . pytest
      - name: unit / scenario tests (temp dirs only)
        run: python -m pytest -v
      - name: CLI entry point
        run: cc-sessionsync --version

  resume:
    # 导入的会话用真的 Claude Code 命令行 --resume 打开（假 API，本机，不联网不登录）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: verify claude --resume opens an imported Codex conversation
        run: python tools/verify_resume.py "" 8799

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: wheel + sdist
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl && /tmp/v/bin/cc-sessionsync --version
          /tmp/v/bin/python -c "import cc_sessionsync, pathlib; assert (pathlib.Path(cc_sessionsync.__file__).parent / 'index.html').exists()"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: python-dist
          path: dist/*

  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          architecture: x64
      - name: build + smoke test (Nuitka onefile)
        shell: pwsh
        run: tools\build_exe.ps1
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-exe
          path: dist/cc-sessionsync-*-windows-x64.exe*
          if-no-files-found: error
