name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install -e . pytest
      - name: unit / scenario tests (temp dirs only)
        run: python -m pytest -v
      - name: CLI entry point
        run: cc-sessionsync --version

  resume:
    # 导入的会话用真的 Claude Code 命令行 --resume 打开（假 API，本机，不联网不登录）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: verify claude --resume opens imported, restored (timeline) and md/html-imported sessions
        run: python tools/verify_resume.py "" 8799
      - name: install DeepSeek Harness CLI (MIT) + zstandard
        run: |
          npm install -g @deepseek-ai/dsh@0.2.0-rc.2
          python -m pip install "zstandard>=0.22"
      - name: verify dsh ⇄ Claude Code (claude --resume + dsh --session-id, both against local mocks)
        env:
          DSH_BIN: dsh
        run: python tools/verify_dsh.py "" 8797
      - name: verify Cursor → Claude Code (claude --resume on IDE / agent-transcript / cursor-agent conversations, local mock)
        run: python tools/verify_cursor.py "" 8796
      - name: verify OpenCode / ZCode → Claude Code (claude --resume) and → dsh (dsh --session-id), local mocks
        env:
          DSH_BIN: dsh
        run: python tools/verify_convert.py "" 8794
      - name: install Codex CLI (Apache-2.0)
        run: npm install -g @openai/codex
      - name: verify any → Codex (codex exec resume against a local Responses-API mock)
        run: python tools/verify_codex.py "" 8792
      - name: install OpenCode CLI 2.x (MIT) and 1.x (separate prefix)
        shell: bash
        run: |
          npm install -g @opencode/cli
          npm install --prefix "$RUNNER_TEMP/oc1" opencode-ai@1
      - name: verify any → OpenCode 2.x (session import / list / run -s / delete, local mock)
        run: python tools/verify_opencode.py "" 8790
      - name: verify any → OpenCode 1.x (import / list / run -s / delete, local mock)
        shell: bash
        run: python tools/verify_opencode.py "$RUNNER_TEMP/oc1/node_modules/.bin/opencode" 8788

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: wheel + sdist
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl && /tmp/v/bin/cc-sessionsync --version
          /tmp/v/bin/python -c "import cc_sessionsync, pathlib; d = pathlib.Path(cc_sessionsync.__file__).parent; assert all((d / f).exists() for f in ('index.html', 'icon.ico', 'icon.png', 'tray-badge.ico', 'usage_prices.json', 'fonts/inter-regular.woff2'))"
          /tmp/v/bin/cc-sessionsync selfcheck --offline
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: python-dist
          path: dist/*

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          architecture: x64
      - name: Cache Nuitka (C compile cache, downloads)
        uses: actions/cache@v4.2.3
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('tools/requirements-build.txt') }}-${{ hashFiles('cc_sessionsync/**') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('tools/requirements-build.txt') }}-
            nuitka-${{ runner.os }}-
      - name: Inno Setup
        shell: pwsh
        run: tools\ci_iscc.ps1
      - name: Build (Nuitka app, hidden smoke test, Inno Setup installer)
        shell: pwsh
        run: tools\build_desktop.ps1
      - name: Installer smoke test (silent install to a temp dir, run the installed exe, silent uninstall)
        shell: pwsh
        run: tools\ci_install_smoke.ps1
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-setup
          path: dist/CCSessionSync-Setup-*.exe*
          if-no-files-found: error
