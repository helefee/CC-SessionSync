[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-sessionsync"
dynamic = ["version"]
description = "Claude Code 换号后会话补齐、Codex 对话导入 Claude Code、会话管理 / 备份、用量统计、模型与 API（桌面版 + 命令行，带备份 / 账本 / 撤回）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
authors = [{ name = "helefee" }]
keywords = ["claude-code", "codex", "session", "sync", "claude-desktop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
]
dependencies = ["tomlkit>=0.12", "zstandard>=0.22", "pyyaml>=6"]

[project.optional-dependencies]
desktop = ["pywebview>=5,<7"]

[project.urls]
Homepage = "https://github.com/helefee/CC-SessionSync"
Issues = "https://github.com/helefee/CC-SessionSync/issues"

[project.scripts]
cc-sessionsync = "cc_sessionsync.cli:main"

[tool.setuptools]
packages = ["cc_sessionsync", "cc_sessionsync.i18n"]

[tool.setuptools.package-data]
cc_sessionsync = ["index.html", "*.ico", "*.png", "usage_prices.json", "fonts/*"]
"cc_sessionsync.i18n" = ["*.json"]

[tool.setuptools.dynamic]
version = { attr = "cc_sessionsync.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
